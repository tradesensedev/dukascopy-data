<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dukascopy M1 Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1220;--mut:#64708a;--line:#e5e9f2;--bg:#f7f8fd;--card:#fff;--brand:#4f46e5;--soft:#eef0ff;
  --grad:linear-gradient(135deg,#4f46e5,#2563eb 55%,#06b6d4);--sh:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.05)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:absolute;inset:0 0 auto 0;height:300px;z-index:-1;background:radial-gradient(500px 220px at 10% 0,rgba(79,70,229,.13),transparent 70%),radial-gradient(460px 220px at 90% 0,rgba(6,182,212,.13),transparent 70%)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 0 12px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.02em}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--grad);display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stats span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--mut);font-weight:500}
.stats b{color:var(--ink);font-weight:700}
.title{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
h1{margin:0;font-size:clamp(22px,3.4vw,30px);letter-spacing:-.03em;font-weight:800;line-height:1.1}
h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:4px 0 0}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{color:#fff;background:var(--grad);box-shadow:0 6px 16px rgba(37,99,235,.3)}
.btn.primary:hover{box-shadow:0 8px 20px rgba(37,99,235,.42)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:#c4cde4}
.btn.wide{width:100%;padding:11px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.layout{display:grid;grid-template-columns:1fr 310px;gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
.mk-card{padding:14px 16px}
.bar-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.bar-h h2,.side h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
.link{background:none;border:0;color:var(--brand);font:inherit;font-weight:600;cursor:pointer;padding:0;font-size:12.5px}
.link:hover{text-decoration:underline}
.links{display:flex;gap:12px;align-items:center}
.grp{margin-top:10px}
.gh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.gh h3{margin:0;font-size:13px;font-weight:700}
.gh small{color:var(--mut)}
.gh .sp{flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:7px}
.chip{position:relative;display:block;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;transition:all .12s;user-select:none}
.chip:hover{border-color:#c4cdf5;transform:translateY(-1px)}
.chip input{position:absolute;opacity:0}
.chip b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.chip span{display:block;font-size:11px;color:var(--mut)}
.chip.on{border-color:var(--brand);background:var(--soft)}
.chip.on::after{content:"\2713";position:absolute;top:6px;right:8px;font-size:11px;font-weight:800;color:var(--brand)}
.chip.off{opacity:.45}
.chip:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}
.side{padding:14px 16px;position:sticky;top:12px}
.sec{margin-bottom:14px}
.sec:last-of-type{margin-bottom:12px}
.pre{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.pre button{font:inherit;font-weight:600;font-size:12.5px;color:var(--mut);background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:6px 4px;cursor:pointer;transition:all .12s}
.pre button:hover{border-color:#c4cdf5;color:var(--ink)}
.pre button.act{background:var(--soft);border-color:var(--brand);color:var(--brand)}
.ft{display:flex;align-items:center;gap:8px}
.ft select{flex:1;min-width:0}
.ft em{font-style:normal;color:var(--mut)}
select{font:inherit;font-weight:600;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
select:focus{outline:2px solid var(--brand);outline-offset:1px}
.seg{display:flex;background:#eef1f7;border-radius:9px;padding:3px;margin-top:8px}
.seg label{flex:1;position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:5px 4px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--mut);transition:all .12s}
.seg input:checked+span{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.18)}
.seg input:focus-visible+span{outline:2px solid var(--brand)}
.sw{display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:600;margin-top:12px}
.sw input{position:absolute;opacity:0}
.sw i{width:38px;height:22px;border-radius:99px;background:#cbd5e1;position:relative;transition:background .18s;flex:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.sw input:checked+i{background:var(--brand)}
.sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--brand);outline-offset:2px}
.sum{background:#f4f6fc;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.sum b{font-size:15px;display:block}
.sum span{color:var(--mut);font-size:12px}
.prog{height:5px;background:#e8ecf5;border-radius:99px;margin-top:10px;overflow:hidden;display:none}
.prog.show{display:block}
.prog i{display:block;height:100%;width:0;background:var(--grad);transition:width .2s}
#status{font-size:11.5px;color:var(--mut);margin-top:6px;display:none;word-break:break-all}
#status.show{display:block}
details.files{margin:14px 0 90px}
details.files summary{cursor:pointer;font-weight:700;font-size:13px;padding:11px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.tbl{max-height:280px;overflow:auto;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:#f4f6fb;text-align:left;padding:7px 12px;color:var(--mut);font-weight:600}
td{padding:6px 12px;border-top:1px solid var(--line)}
td a{color:var(--brand);font-weight:600;text-decoration:none}
td a:hover{text-decoration:underline}
.empty{text-align:center;padding:40px 20px;background:var(--card);border:1px dashed #c9d2e6;border-radius:14px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.demo{background:#fff7e0;color:#8a5a00;border:1px solid #f1d98c;border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:600}
.mbar{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .mbar{display:flex;position:fixed;left:10px;right:10px;bottom:10px;z-index:30;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(16,24,40,.22);padding:9px 12px}
  .mbar div{font-weight:700;font-size:13px}.mbar small{display:block;color:var(--mut);font-weight:500;font-size:11.5px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i>M1</i> Dukascopy Data</div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="title">
    <div>
      <h1>1-minute market data, <b>ready to download</b></h1>
      <p class="sub">Bid, ask and volume in organized ZIP folders. Timezone UTC. Updated weekly. <span id="demoTag"></span></p>
    </div>
    <button class="btn ghost" id="latestAll">Latest year &middot; all markets</button>
  </div>

  <div id="app" class="layout">
    <div class="card mk-card">
      <div class="bar-h">
        <h2>Markets <span id="mcount" style="text-transform:none;letter-spacing:0;font-weight:500"></span></h2>
        <div class="links"><button class="link" id="mAll">Select all</button><button class="link" id="mNone">Clear</button></div>
      </div>
      <div id="mlist"></div>
    </div>

    <aside class="card side">
      <div class="sec">
        <h2>Period</h2>
        <div class="pre" id="presets"></div>
        <div class="ft"><select id="from"></select><em>to</em><select id="to"></select></div>
      </div>
      <div class="sec">
        <h2>Price</h2>
        <div class="seg" id="sides"></div>
        <label class="sw"><span>Include volume</span><input type="checkbox" id="vol" checked><i></i></label>
      </div>
      <div class="sum"><b id="sumA">-</b><span id="sumB"></span></div>
      <button class="btn primary wide" id="zip">Download ZIP</button>
      <div class="prog" id="bar"><i id="pbar"></i></div>
      <div id="status"></div>
    </aside>
  </div>

  <div id="emptyBox"></div>

  <details class="files" id="filesBox">
    <summary>Browse individual files</summary>
    <div class="tbl"><table><thead><tr><th>File</th><th>Size</th><th>Updated</th></tr></thead><tbody id="rows"></tbody></table></div>
  </details>
</div>

<div class="mbar" id="mbar">
  <div id="mSum">-</div>
  <button class="btn primary" id="zip2">Download ZIP</button>
</div>

<script type="module">
import { downloadZip } from "https://cdn.jsdelivr.net/npm/client-zip@2.4.5/index.js";

const $ = (id) => document.getElementById(id);
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
const fmt = (b) => (b > 1e9 ? (b / 1e9).toFixed(2) + " GB" : (b / 1e6).toFixed(0) + " MB");
const GROUP_ORDER = ["Forex Majors", "Forex Crosses", "Crypto", "Metals & Energy", "Indices", "Other"];
const demo = new URLSearchParams(location.search).has("demo");

let files = [], meta = {}, markets = [], years = [], range = {}, maxY = {};
let selM = new Set(), from = 0, to = 0, side = "both", latestOnly = false, busy = false;

const inScope = (f) => (side === "both" || f.side === side) &&
  (latestOnly ? f.year === maxY[f.market] : f.year >= from && f.year <= to);
const filtered = () => files.filter((f) => selM.has(f.market) && inScope(f))
  .sort((a, b) => a.market.localeCompare(b.market) || a.year - b.year || a.side.localeCompare(b.side));

function renderMarkets() {
  const groups = {};
  markets.forEach((m) => { const g = (meta[m] && meta[m].group) || "Other"; (groups[g] = groups[g] || []).push(m); });
  const root = $("mlist"); root.innerHTML = "";
  GROUP_ORDER.filter((g) => groups[g]).forEach((g) => {
    const ms = groups[g], n = ms.filter((m) => selM.has(m)).length, all = n === ms.length;
    const sec = el("div", "grp"), gh = el("div", "gh");
    const h = el("h3"); h.textContent = g;
    const sm = el("small"); sm.textContent = `${n}/${ms.length}`;
    const tg = el("button", "link"); tg.textContent = all ? "Clear" : "Select all";
    tg.onclick = () => { ms.forEach((m) => (all ? selM.delete(m) : selM.add(m))); refresh(); };
    gh.append(h, sm, el("span", "sp"), tg); sec.append(gh);
    const grid = el("div", "grid");
    ms.forEach((m) => {
      const on = selM.has(m);
      const hasData = latestOnly || (range[m][1] >= from && range[m][0] <= to);
      const chip = el("label", "chip" + (on ? " on" : "") + (!hasData ? " off" : ""));
      chip.title = ((meta[m] && meta[m].name) || m) + (hasData ? "" : " (no data in this period)");
      const c = el("input"); c.type = "checkbox"; c.checked = on;
      c.onchange = () => { c.checked ? selM.add(m) : selM.delete(m); refresh(); };
      const b = el("b"); b.textContent = m;
      const s = el("span"); s.textContent = `${range[m][0]}\u2013${range[m][1]}`;
      chip.append(c, b, s); grid.append(chip);
    });
    sec.append(grid); root.append(sec);
  });
}

function renderControls() {
  const last = years[years.length - 1];
  const p3 = Math.max(years[0], last - 2), p5 = Math.max(years[0], last - 4);
  const active = latestOnly ? "latest" : to === last && from === p3 ? "3" : to === last && from === p5 ? "5" :
    from === years[0] && to === last ? "all" : "";
  $("presets").innerHTML = "";
  [["latest", "Latest year"], ["3", "Last 3 yrs"], ["5", "Last 5 yrs"], ["all", "Full history"]].forEach(([k, t]) => {
    const b = el("button", active === k ? "act" : ""); b.textContent = t;
    b.onclick = () => {
      latestOnly = k === "latest";
      if (k === "all") { from = years[0]; to = last; }
      else if (k !== "latest") { to = last; from = Math.max(years[0], last - (+k - 1)); }
      refresh();
    };
    $("presets").append(b);
  });
  $("from").value = from; $("to").value = to;
  $("from").disabled = $("to").disabled = latestOnly;
  $("sides").innerHTML = "";
  [["both", "Bid + Ask"], ["bid", "Bid"], ["ask", "Ask"]].forEach(([v, t]) => {
    const l = el("label"), r = el("input"); r.type = "radio"; r.name = "side"; r.checked = side === v;
    r.onchange = () => { side = v; refresh(); };
    const s = el("span"); s.textContent = t; l.append(r, s); $("sides").append(l);
  });
}

function refresh() {
  renderMarkets(); renderControls();
  const list = filtered(), total = list.reduce((s, f) => s + f.size, 0);
  $("mcount").textContent = `\u00b7 ${selM.size}/${markets.length} selected`;
  $("sumA").textContent = `${list.length} files \u00b7 ${fmt(total)}`;
  $("sumB").textContent = `${selM.size} markets \u00b7 ` + (latestOnly ? "latest year each" : from === to ? from : `${from}\u2013${to}`);
  $("mSum").innerHTML = `${list.length} files<small>${fmt(total)}</small>`;
  $("zip").disabled = $("zip2").disabled = busy || !list.length || demo;
  $("rows").innerHTML = list.map((f) =>
    `<tr><td><a href="/dl/${f.name}" data-n="${f.name}">${f.name}</a></td><td>${fmt(f.size)}</td><td>${f.updated.slice(0, 10)}</td></tr>`).join("");
}

// volume column strip (browser-e)
const strip = (s) => s.replace(/,[^,\r\n]*(?=\r?\n|$)/g, "");
function processStream(body, withVolume, onBytes) {
  const dec = new TextDecoder(), enc = new TextEncoder();
  let buf = "", first = true, doStrip = false;
  return body.pipeThrough(new TransformStream({
    transform(chunk, c) {
      onBytes && onBytes(chunk.length);
      if (withVolume) return c.enqueue(chunk);
      buf += dec.decode(chunk, { stream: true });
      if (first) { const nl = buf.indexOf("\n"); if (nl < 0) return; doStrip = /volume/i.test(buf.slice(0, nl)); first = false; }
      const i = buf.lastIndexOf("\n"); if (i < 0) return;
      const part = buf.slice(0, i + 1); buf = buf.slice(i + 1);
      c.enqueue(enc.encode(doStrip ? strip(part) : part));
    },
    flush(c) { if (!withVolume && buf) c.enqueue(enc.encode(doStrip ? strip(buf) : buf)); },
  }));
}
function saveBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
const say = (t) => { $("status").textContent = t; $("status").classList.add("show"); };

$("rows").addEventListener("click", async (e) => {
  const a = e.target.closest("a[data-n]"); if (!a) return;
  if (demo) { e.preventDefault(); return; }
  if ($("vol").checked) return;
  e.preventDefault(); say("Preparing " + a.dataset.n + "...");
  const r = await fetch("/dl/" + a.dataset.n);
  if (!r.ok) return say("Error " + r.status);
  saveBlob(await new Response(processStream(r.body, false)).blob(), a.dataset.n);
  say("Done.");
});

async function startZip() {
  if (demo) return say("Demo mode: real file nai.");
  const list = filtered(); if (!list.length || busy) return;
  const withVol = $("vol").checked, total = list.reduce((s, f) => s + f.size, 0);
  let done = 0, n = 0; const t0 = Date.now();
  busy = true; $("zip").disabled = $("zip2").disabled = $("latestAll").disabled = true;
  $("bar").classList.add("show"); $("pbar").style.width = "0";
  const zipName = "dukascopy-m1-" + new Date().toISOString().slice(0, 10) + ".zip";

  async function* gen() {
    for (const f of list) {
      n++;
      const r = await fetch("/dl/" + f.name);
      if (!r.ok) throw new Error(f.name + " failed: " + r.status);
      const body = processStream(r.body, withVol, (b) => {
        done += b;
        const pct = Math.min(100, (done / total) * 100), sp = done / 1e6 / Math.max(1, (Date.now() - t0) / 1000);
        $("pbar").style.width = pct + "%";
        say(`${n}/${list.length} \u00b7 ${f.name} \u00b7 ${pct.toFixed(0)}% \u00b7 ${sp.toFixed(1)} MB/s`);
      });
      yield { name: `${f.market}/${f.name}`, lastModified: new Date(f.updated), input: new Response(body) };
    }
  }
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: zipName, types: [{ description: "ZIP", accept: { "application/zip": [".zip"] } }] });
      await downloadZip(gen()).body.pipeTo(await h.createWritable());
    } else saveBlob(await downloadZip(gen()).blob(), zipName);
    $("pbar").style.width = "100%"; say("Done. ZIP saved.");
  } catch (e) {
    say(e.name === "AbortError" ? "Cancelled." : "Error: " + e.message);
  }
  busy = false; $("latestAll").disabled = false; refresh();
}

function demoFiles() {
  const out = [], cy = new Date().getFullYear();
  Object.keys(meta).forEach((m, i) => {
    const start = ["BTCUSD", "ETHUSD", "LTCUSD"].includes(m) ? 2017 : 2003 + ((i * 3) % 10);
    for (let y = start; y <= cy; y++) ["bid", "ask"].forEach((s) =>
      out.push({ name: `${m}_${y}_${s}.csv`, id: 0, market: m, year: y, side: s, size: 18e6 + ((i * 7 + y) % 20) * 1e6, updated: `${y === cy ? cy : y + 1}-01-03T06:00:00Z` }));
  });
  return out;
}

function showEmpty(title, text) {
  $("app").style.display = "none"; $("filesBox").style.display = "none"; $("mbar").style.display = "none";
  $("latestAll").disabled = true;
  $("emptyBox").innerHTML = `<div class="empty"><b>${title}</b>${text}</div>`;
}

async function init() {
  try { meta = await (await fetch("/markets.json")).json(); } catch { meta = {}; }
  if (demo) { files = demoFiles(); $("demoTag").innerHTML = '<span class="demo">Demo preview</span>'; }
  else {
    let r; try { r = await fetch("/api/files"); } catch { r = { ok: false, status: "network" }; }
    if (!r.ok) return showEmpty("Could not load the file list", "Error " + r.status + ". Kichukkhon pore reload koro.");
    files = await r.json();
  }
  if (!files.length) return showEmpty("Data is being prepared", "Backfill cholche. Kichukkhon pore reload dao.");

  markets = [...new Set(files.map((f) => f.market))].sort();
  years = [...new Set(files.map((f) => f.year))].sort((a, b) => a - b);
  markets.forEach((m) => {
    const ys = files.filter((f) => f.market === m).map((f) => f.year);
    range[m] = [Math.min(...ys), Math.max(...ys)]; maxY[m] = range[m][1];
  });
  $("from").innerHTML = $("to").innerHTML = years.map((y) => `<option>${y}</option>`).join("");
  selM = new Set(markets); from = to = years[years.length - 1]; latestOnly = true;
  const last = files.map((f) => f.updated).sort().pop();
  $("stats").innerHTML = [
    [markets.length, "markets"], [years[0] + "\u2013" + years[years.length - 1], ""],
    [fmt(files.reduce((s, f) => s + f.size, 0)), "total"], ["updated " + last.slice(0, 10), ""],
  ].map(([v, l]) => `<span><b>${v}</b> ${l}</span>`).join("");
  refresh();
}

$("mAll").onclick = () => { selM = new Set(markets); refresh(); };
$("mNone").onclick = () => { selM = new Set(); refresh(); };
$("from").onchange = (e) => { from = +e.target.value; if (to < from) to = from; latestOnly = false; refresh(); };
$("to").onchange = (e) => { to = +e.target.value; if (from > to) from = to; latestOnly = false; refresh(); };
$("zip").onclick = $("zip2").onclick = startZip;
$("latestAll").onclick = () => { selM = new Set(markets); side = "both"; latestOnly = true; refresh(); startZip(); };

init();
</script>
</body>
</html>
