<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dukascopy M1 // data terminal</title>
<style>
:root{--bg:#020402;--fg:#3dff86;--dim:#1fa354;--mut:#2b7a4a;--amb:#ffb000;--line:#17693a;--sel:#062a12;--red:#ff5a5a}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--fg);font:14px/1.55 "Cascadia Mono","Fira Code",Consolas,ui-monospace,monospace;text-shadow:0 0 5px rgba(61,255,134,.35);
  background:radial-gradient(ellipse at top,#07200f 0%,var(--bg) 60%);min-height:100vh}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);z-index:50}
main{max-width:1000px;margin:0 auto;padding:22px 16px 170px}
h1{font-size:15px;margin:0;font-weight:400}
.cur{display:inline-block;width:.6em;height:1.1em;background:var(--fg);vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
.meta{color:var(--mut);margin:2px 0 18px;font-size:12px}
.demo{color:var(--amb);border:1px dashed var(--amb);padding:4px 10px;margin-bottom:14px;font-size:12px;text-shadow:none}
.box{border:1px solid var(--line);margin:0 0 16px;padding:14px 12px 12px;position:relative}
.box>.t{position:absolute;top:-.8em;left:10px;background:var(--bg);padding:0 8px;color:var(--amb);text-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--fg);padding:3px 12px;cursor:pointer;text-shadow:inherit}
.btn:hover,.btn:focus-visible{background:var(--fg);color:var(--bg);text-shadow:none;outline:none}
.btn:disabled{opacity:.35;cursor:not-allowed;background:transparent;color:var(--fg)}
.btn.big{padding:7px 18px;font-weight:700}
.btn.sm{padding:0 8px;font-size:12px;border-color:var(--dim);color:var(--dim)}
.btn.amb{border-color:var(--amb);color:var(--amb)}
.btn.amb:hover{background:var(--amb);color:var(--bg)}
input[type=search]{font:inherit;color:var(--fg);background:#000;border:1px solid var(--line);padding:4px 8px;width:100%;max-width:300px;caret-color:var(--fg);text-shadow:inherit}
input[type=search]:focus{outline:1px solid var(--fg)}
input[type=search]::placeholder{color:var(--mut)}
input[type=checkbox],input[type=radio]{appearance:none;-webkit-appearance:none;margin:0;font:inherit;color:var(--fg);cursor:pointer;width:3.2ch;height:1.4em;position:relative;flex:none}
input[type=checkbox]::before{content:"[ ]";position:absolute;inset:0}
input[type=checkbox]:checked::before{content:"[x]";color:var(--amb)}
input[type=checkbox]:indeterminate::before{content:"[-]";color:var(--amb)}
input[type=radio]::before{content:"( )";position:absolute;inset:0}
input[type=radio]:checked::before{content:"(*)";color:var(--amb)}
input:focus-visible{outline:1px dotted var(--fg);outline-offset:2px}
.grp{margin-bottom:12px}
.ghead{display:flex;gap:6px;align-items:center;color:var(--amb);cursor:pointer;border-bottom:1px solid var(--line);margin-bottom:4px;text-shadow:none}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.mrow{display:flex;gap:6px;align-items:center;padding:1px 4px;cursor:pointer;white-space:nowrap}
.mrow:hover{background:var(--sel)}
.mrow.on{background:var(--sel)}
.sym{width:8ch;font-weight:700}
.nm{color:var(--dim);overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.yr{color:var(--mut);font-size:12px}
.cnt{width:7ch;text-align:right;color:var(--amb);font-size:12px;text-shadow:none}
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(7ch,1fr));gap:4px}
.y{font:inherit;color:var(--mut);background:transparent;border:1px solid var(--line);padding:2px 0;cursor:pointer;text-shadow:inherit}
.y:hover{border-color:var(--fg);color:var(--fg)}
.y.dim{opacity:.4}
.y.in{background:var(--sel);color:var(--fg);border-color:var(--dim)}
.y.edge{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700;text-shadow:none}
.hint{color:var(--mut);font-size:12px;margin-top:8px}
.opts label{display:inline-flex;gap:4px;align-items:center;margin-right:18px;cursor:pointer}
details summary{cursor:pointer;color:var(--amb);text-shadow:none;margin-bottom:6px}
.tbl{max-height:300px;overflow:auto;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:2px 10px;border-bottom:1px solid #0b2a17}
th{position:sticky;top:0;background:#031006;color:var(--amb)}
a{color:var(--fg)}
a:hover{background:var(--fg);color:var(--bg)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(2,4,2,.96);border-top:1px solid var(--fg);padding:10px 16px;z-index:60}
.bar .in{max-width:1000px;margin:0 auto}
.prog{height:12px;border:1px solid var(--line);margin:8px 0 4px}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--fg) 0 7px,transparent 7px 9px)}
#status{font-size:12px;color:var(--mut)}
#summary{color:var(--fg)}
@media (max-width:700px){.mgrid{grid-template-columns:1fr}.nm{display:none}main{padding-bottom:200px}}
</style>
</head>
<body>
<main>
  <h1>root@dukascopy:~$ m1-data --list<span class="cur"></span></h1>
  <p class="meta" id="meta">loading...</p>
  <div id="demoBanner"></div>

  <div class="box"><span class="t">QUICK</span>
    <div class="row">
      <button class="btn big" id="latestAll">&gt; LATEST: ALL MARKETS</button>
      <button class="btn big" id="latestSel">&gt; LATEST: SELECTED</button>
    </div>
    <div class="hint">Latest = prottek market-er sheshe available year, ZIP-e MARKET/ folder structure-e.</div>
  </div>

  <div class="box"><span class="t">1 // MARKETS</span>
    <div class="row" style="margin-bottom:10px">
      <input type="search" id="q" placeholder="search: eurusd, gold, btc...">
      <button class="btn sm" id="mAll">[ ALL ]</button>
      <button class="btn sm" id="mNone">[ NONE ]</button>
      <span class="hint" id="mcount" style="margin:0"></span>
    </div>
    <div id="mlist"></div>
  </div>

  <div class="box"><span class="t">2 // PERIOD</span>
    <div class="row" style="margin-bottom:10px">
      <button class="btn sm" data-p="latest">[ LATEST YEAR ]</button>
      <button class="btn sm" data-p="3">[ LAST 3Y ]</button>
      <button class="btn sm" data-p="5">[ LAST 5Y ]</button>
      <button class="btn sm" data-p="all">[ FULL HISTORY ]</button>
      <span id="period" style="color:var(--amb);text-shadow:none"></span>
    </div>
    <div class="years" id="years"></div>
    <div class="hint" id="yhint"></div>
  </div>

  <div class="box"><span class="t">3 // OPTIONS</span>
    <div class="opts row" id="sides"></div>
    <div class="opts" style="margin-top:8px"><label><input type="checkbox" id="vol" checked> include volume column</label></div>
  </div>

  <details>
    <summary>&gt; show file list</summary>
    <div class="tbl"><table><thead><tr><th>file</th><th>size</th><th>updated</th></tr></thead><tbody id="rows"></tbody></table></div>
  </details>
</main>

<div class="bar"><div class="in">
  <div class="row">
    <button class="btn big" id="zip">&gt; DOWNLOAD ZIP</button>
    <span id="summary"></span>
  </div>
  <div class="prog"><i id="pbar"></i></div>
  <div id="status">ready.</div>
</div></div>

<script type="module">
import { downloadZip } from "https://cdn.jsdelivr.net/npm/client-zip@2.4.5/index.js";

const $ = (id) => document.getElementById(id);
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
const fmt = (b) => (b > 1e9 ? (b / 1e9).toFixed(2) + " GB" : (b / 1e6).toFixed(1) + " MB");
const GROUP_ORDER = ["Forex Majors", "Forex Crosses", "Crypto", "Metals & Energy", "Indices", "Other"];
const demo = new URLSearchParams(location.search).has("demo");

let files = [], meta = {}, markets = [], years = [], range = {}, maxY = {}, counts = {};
let selM = new Set(), from = 0, to = 0, side = "both", latestOnly = false, anchor = null, q = "";

const inScope = (f) => (side === "both" || f.side === side) &&
  (latestOnly ? f.year === maxY[f.market] : f.year >= from && f.year <= to);
const filtered = () => files.filter((f) => selM.has(f.market) && inScope(f))
  .sort((a, b) => a.market.localeCompare(b.market) || a.year - b.year || a.side.localeCompare(b.side));
const matches = (m) => !q || (m + " " + ((meta[m] && meta[m].name) || "")).toLowerCase().includes(q);

function renderMarkets() {
  const groups = {};
  markets.forEach((m) => { const g = (meta[m] && meta[m].group) || "Other"; (groups[g] = groups[g] || []).push(m); });
  const list = $("mlist"); list.innerHTML = "";
  GROUP_ORDER.filter((g) => groups[g]).forEach((g) => {
    const ms = groups[g].filter(matches); if (!ms.length) return;
    const nSel = ms.filter((m) => selM.has(m)).length;
    const sec = el("div", "grp");
    const head = el("label", "ghead");
    const cb = el("input"); cb.type = "checkbox";
    cb.checked = nSel === ms.length; cb.indeterminate = nSel > 0 && nSel < ms.length;
    cb.onchange = () => { ms.forEach((m) => (cb.checked ? selM.add(m) : selM.delete(m))); refresh(); };
    head.append(cb, document.createTextNode(`${g.toUpperCase()} (${nSel}/${ms.length})`));
    sec.append(head);
    const grid = el("div", "mgrid");
    ms.forEach((m) => {
      const row = el("label", "mrow" + (selM.has(m) ? " on" : ""));
      const c = el("input"); c.type = "checkbox"; c.checked = selM.has(m);
      c.onchange = () => { c.checked ? selM.add(m) : selM.delete(m); refresh(); };
      const s = el("span", "sym"); s.textContent = m;
      const n = el("span", "nm"); n.textContent = (meta[m] && meta[m].name) || "";
      const y = el("span", "yr"); y.textContent = `${range[m][0]}-${range[m][1]}`;
      const k = el("span", "cnt"); k.textContent = (counts[m] || 0) + " f";
      row.append(c, s, n, y, k); grid.append(row);
    });
    sec.append(grid); list.append(sec);
  });
}

function renderYears() {
  const avail = new Set(files.filter((f) => selM.has(f.market)).map((f) => f.year));
  $("years").innerHTML = "";
  years.forEach((y) => {
    const b = el("button", "y"); b.textContent = y;
    if (!avail.has(y)) b.classList.add("dim");
    if (!latestOnly && y >= from && y <= to) b.classList.add("in");
    if (!latestOnly && (y === from || y === to)) b.classList.add("edge");
    if (anchor === y) b.classList.add("edge");
    b.onclick = () => {
      latestOnly = false;
      if (anchor === null) { anchor = y; from = to = y; }
      else { from = Math.min(anchor, y); to = Math.max(anchor, y); anchor = null; }
      refresh();
    };
    $("years").append(b);
  });
  $("period").textContent = latestOnly ? "latest year per market" : from === to ? `${from}` : `${from} -> ${to}`;
  $("yhint").textContent = anchor !== null ? "now click the END year..." : "click START year, then END year. Dim year = selected market-e data nai.";
}

function renderSides() {
  $("sides").innerHTML = "";
  [["both", "bid + ask"], ["bid", "bid only"], ["ask", "ask only"]].forEach(([v, t]) => {
    const l = el("label"); const r = el("input"); r.type = "radio"; r.name = "side"; r.checked = side === v;
    r.onchange = () => { side = v; refresh(); };
    l.append(r, document.createTextNode(t)); $("sides").append(l);
  });
}

function refresh() {
  counts = {};
  files.forEach((f) => { if (inScope(f)) counts[f.market] = (counts[f.market] || 0) + 1; });
  renderMarkets(); renderYears(); renderSides();
  const list = filtered(), total = list.reduce((s, f) => s + f.size, 0);
  $("mcount").textContent = `${selM.size}/${markets.length} selected`;
  $("summary").textContent = `${selM.size} markets | ${list.length} files | ${fmt(total)}`;
  $("zip").disabled = !list.length || demo;
  $("rows").innerHTML = list.map((f) =>
    `<tr><td><a href="/dl/${f.name}" data-n="${f.name}">${f.name}</a></td><td>${fmt(f.size)}</td><td>${f.updated.slice(0, 10)}</td></tr>`).join("");
}

// ---- volume column strip ----
const strip = (s) => s.replace(/,[^,\r\n]*(?=\r?\n|$)/g, "");
function processStream(body, withVolume, onBytes) {
  const dec = new TextDecoder(), enc = new TextEncoder();
  let buf = "", first = true, doStrip = false;
  return body.pipeThrough(new TransformStream({
    transform(chunk, c) {
      onBytes && onBytes(chunk.length);
      if (withVolume) return c.enqueue(chunk);
      buf += dec.decode(chunk, { stream: true });
      if (first) { const nl = buf.indexOf("\n"); if (nl < 0) return; doStrip = /volume/i.test(buf.slice(0, nl)); first = false; }
      const i = buf.lastIndexOf("\n"); if (i < 0) return;
      const part = buf.slice(0, i + 1); buf = buf.slice(i + 1);
      c.enqueue(enc.encode(doStrip ? strip(part) : part));
    },
    flush(c) { if (!withVolume && buf) c.enqueue(enc.encode(doStrip ? strip(buf) : buf)); },
  }));
}
function saveBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

$("rows").addEventListener("click", async (e) => {
  const a = e.target.closest("a[data-n]"); if (!a || $("vol").checked || demo) { if (demo && a) e.preventDefault(); return; }
  e.preventDefault();
  $("status").textContent = "preparing " + a.dataset.n + "...";
  const r = await fetch("/dl/" + a.dataset.n);
  if (!r.ok) { $("status").textContent = "error " + r.status; return; }
  saveBlob(await new Response(processStream(r.body, false)).blob(), a.dataset.n);
  $("status").textContent = "done.";
});

async function startZip() {
  if (demo) { $("status").textContent = "demo mode: no real files."; return; }
  const list = filtered(); if (!list.length) return;
  const withVol = $("vol").checked, total = list.reduce((s, f) => s + f.size, 0);
  let done = 0, n = 0; const t0 = Date.now();
  $("zip").disabled = $("latestAll").disabled = $("latestSel").disabled = true;
  const zipName = "dukascopy-m1-" + new Date().toISOString().slice(0, 10) + ".zip";

  async function* gen() {
    for (const f of list) {
      n++;
      const r = await fetch("/dl/" + f.name);
      if (!r.ok) throw new Error(f.name + " failed: " + r.status);
      const body = processStream(r.body, withVol, (b) => {
        done += b;
        const pct = Math.min(100, (done / total) * 100), sp = done / 1e6 / Math.max(1, (Date.now() - t0) / 1000);
        $("pbar").style.width = pct + "%";
        $("status").textContent = `[${n}/${list.length}] ${f.name} | ${pct.toFixed(0)}% | ${sp.toFixed(1)} MB/s`;
      });
      yield { name: `${f.market}/${f.name}`, lastModified: new Date(f.updated), input: new Response(body) };
    }
  }
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: zipName, types: [{ description: "ZIP", accept: { "application/zip": [".zip"] } }] });
      await downloadZip(gen()).body.pipeTo(await h.createWritable());
    } else saveBlob(await downloadZip(gen()).blob(), zipName);
    $("pbar").style.width = "100%"; $("status").textContent = "done.";
  } catch (e) {
    $("status").textContent = e.name === "AbortError" ? "cancelled." : "error: " + e.message;
  }
  $("latestAll").disabled = $("latestSel").disabled = false; refresh();
}

function demoFiles() {
  const out = [], cy = new Date().getFullYear();
  Object.keys(meta).forEach((m, i) => {
    const start = m.includes("USD") && ["BTCUSD", "ETHUSD", "LTCUSD"].includes(m) ? 2017 : 2003 + ((i * 3) % 10);
    for (let y = start; y <= cy; y++) ["bid", "ask"].forEach((s) =>
      out.push({ name: `${m}_${y}_${s}.csv`, id: 0, market: m, year: y, side: s, size: 18e6 + ((i * 7 + y) % 20) * 1e6, updated: `${y === cy ? cy : y + 1}-01-03T06:00:00Z` }));
  });
  return out;
}

async function init() {
  try { meta = await (await fetch("/markets.json")).json(); } catch { meta = {}; }
  if (demo) { files = demoFiles(); $("demoBanner").innerHTML = '<div class="demo">DEMO MODE: fake file list for UI preview. Downloads disabled.</div>'; }
  else {
    const r = await fetch("/api/files");
    if (!r.ok) { $("meta").textContent = "ERR: file list load hoyni (" + r.status + ")"; return; }
    files = await r.json();
  }
  if (!files.length) {
    $("meta").textContent = "no data in releases yet. backfill job cholche, kichukkhon pore reload dao. (UI dekhte URL-er sheshe ?demo)";
    $("zip").disabled = $("latestAll").disabled = $("latestSel").disabled = true; return;
  }
  markets = [...new Set(files.map((f) => f.market))].sort();
  years = [...new Set(files.map((f) => f.year))].sort((a, b) => a - b);
  markets.forEach((m) => {
    const ys = files.filter((f) => f.market === m).map((f) => f.year);
    range[m] = [Math.min(...ys), Math.max(...ys)]; maxY[m] = range[m][1];
  });
  selM = new Set(markets); from = to = years[years.length - 1];
  const last = files.map((f) => f.updated).sort().pop();
  $("meta").textContent = `${markets.length} markets | ${years[0]}-${years[years.length - 1]} | last update ${last.slice(0, 10)} | tz: UTC`;
  refresh();
}

$("q").oninput = (e) => { q = e.target.value.trim().toLowerCase(); renderMarkets(); };
$("mAll").onclick = () => { selM = new Set(markets); refresh(); };
$("mNone").onclick = () => { selM = new Set(); refresh(); };
document.querySelectorAll("[data-p]").forEach((b) => (b.onclick = () => {
  const p = b.dataset.p, last = years[years.length - 1]; anchor = null; latestOnly = false;
  if (p === "latest") from = to = last;
  else if (p === "all") { from = years[0]; to = last; }
  else { to = last; from = Math.max(years[0], last - (+p - 1)); }
  refresh();
}));
$("zip").onclick = startZip;
$("latestAll").onclick = () => { selM = new Set(markets); side = "both"; latestOnly = true; anchor = null; refresh(); startZip(); };
$("latestSel").onclick = () => { if (!selM.size) return; side = "both"; latestOnly = true; anchor = null; refresh(); startZip(); };

init();
</script>
</body>
</html>
