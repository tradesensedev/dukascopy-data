<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dukascopy M1 Data</title>
<style>
:root{--bg:#f5f2ea;--card:#fffdf8;--txt:#1d1b16;--mut:#6f6a5d;--line:#d9d3c2;--acc:#1d4ed8;--accbg:#e8eefc;--hd:#efeadb}
@media (prefers-color-scheme:dark){:root{--bg:#191814;--card:#22211c;--txt:#ece8dc;--mut:#9b9684;--line:#38362d;--acc:#7aa2ff;--accbg:#27304a;--hd:#2b2a23}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:28px 16px 130px}
h1{font:700 28px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
h2{font:700 17px Georgia,"Times New Roman",serif;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 22px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--txt);border-radius:4px;padding:6px 14px;cursor:pointer;transition:background .15s,color .15s}
.btn:hover{background:var(--txt);color:var(--card)}
.btn:disabled{opacity:.4;cursor:not-allowed;background:var(--card);color:var(--txt)}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;padding:8px 20px}
.btn.main:hover{filter:brightness(1.1);background:var(--acc);color:#fff}
.link{background:none;border:0;color:var(--acc);cursor:pointer;font:inherit;padding:0;text-decoration:underline}
select{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:5px 8px}
input[type=checkbox],input[type=radio]{accent-color:var(--acc);width:16px;height:16px;margin:0;cursor:pointer}
label{cursor:pointer}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:6px 8px;border-bottom:2px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
tr.g td{background:var(--hd);font-weight:700;font-family:Georgia,serif}
tr.m{transition:background .12s}
tr.m:hover{background:var(--accbg)}
tr.m.on{background:var(--accbg)}
.sym{font-weight:700;font-family:ui-monospace,Consolas,monospace}
.num{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--mut);white-space:nowrap}
.cnt{text-align:right;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.chk{width:34px}
.opts label{margin-right:20px;display:inline-flex;gap:6px;align-items:center}
.hint{color:var(--mut);font-size:13px;margin-top:8px}
.demo{background:#fff4d6;color:#6b4e00;border:1px solid #e5cf8a;border-radius:4px;padding:6px 12px;margin-bottom:16px;font-size:13px}
details summary{cursor:pointer;font:700 17px Georgia,serif}
.tbl{max-height:300px;overflow:auto;margin-top:10px}
a{color:var(--acc)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.08);padding:10px 16px}
.bar .in{max-width:820px;margin:0 auto}
.prog{height:6px;background:var(--hd);border-radius:3px;margin:8px 0 4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#status{font-size:13px;color:var(--mut)}
@media (max-width:600px){.hide-s{display:none}h1{font-size:23px}}
</style>
</head>
<body>
<main>
  <h1>Dukascopy 1-Minute Data</h1>
  <p class="sub" id="meta">Loading...</p>
  <div id="demoBanner"></div>

  <div class="card">
    <div class="row">
      <button class="btn main" id="latestAll">Download latest (all markets)</button>
      <span class="hint" style="margin:0">Prottek market-er shesh year, bid + ask, ZIP-e MARKET/ folder.</span>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <h2 style="margin:0">1. Markets</h2>
      <span class="row" style="gap:12px"><button class="link" id="mAll">Select all</button><button class="link" id="mNone">Clear</button><span class="hint" id="mcount" style="margin:0"></span></span>
    </div>
    <table>
      <thead><tr><th class="chk"></th><th>Symbol</th><th class="hide-s">Name</th><th>Data</th><th style="text-align:right">Files</th></tr></thead>
      <tbody id="mlist"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>2. Period</h2>
    <div class="row">
      <label>From <select id="from"></select></label>
      <label>To <select id="to"></select></label>
      <button class="link" data-p="latest">Latest year</button>
      <button class="link" data-p="3">Last 3 years</button>
      <button class="link" data-p="5">Last 5 years</button>
      <button class="link" data-p="all">Full history</button>
    </div>
    <div class="hint">Jei market-e oi period-e data nai, shey market-er file ashbe na.</div>
  </div>

  <div class="card">
    <h2>3. Options</h2>
    <div class="opts" id="sides"></div>
    <div class="opts" style="margin-top:10px"><label><input type="checkbox" id="vol" checked> Include volume column</label></div>
  </div>

  <div class="card">
    <details>
      <summary>File list</summary>
      <div class="tbl"><table><thead><tr><th>File</th><th>Size</th><th>Updated</th></tr></thead><tbody id="rows"></tbody></table></div>
    </details>
  </div>
</main>

<div class="bar"><div class="in">
  <div class="row"><button class="btn main" id="zip">Download ZIP</button><span id="summary"></span></div>
  <div class="prog"><i id="pbar"></i></div>
  <div id="status">Ready.</div>
</div></div>

<script type="module">
import { downloadZip } from "https://cdn.jsdelivr.net/npm/client-zip@2.4.5/index.js";

const $ = (id) => document.getElementById(id);
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
const fmt = (b) => (b > 1e9 ? (b / 1e9).toFixed(2) + " GB" : (b / 1e6).toFixed(1) + " MB");
const GROUP_ORDER = ["Forex Majors", "Forex Crosses", "Crypto", "Metals & Energy", "Indices", "Other"];
const demo = new URLSearchParams(location.search).has("demo");

let files = [], meta = {}, markets = [], years = [], range = {}, maxY = {}, counts = {};
let selM = new Set(), from = 0, to = 0, side = "both", latestOnly = false;

const inScope = (f) => (side === "both" || f.side === side) &&
  (latestOnly ? f.year === maxY[f.market] : f.year >= from && f.year <= to);
const filtered = () => files.filter((f) => selM.has(f.market) && inScope(f))
  .sort((a, b) => a.market.localeCompare(b.market) || a.year - b.year || a.side.localeCompare(b.side));

function renderMarkets() {
  const groups = {};
  markets.forEach((m) => { const g = (meta[m] && meta[m].group) || "Other"; (groups[g] = groups[g] || []).push(m); });
  const body = $("mlist"); body.innerHTML = "";
  GROUP_ORDER.filter((g) => groups[g]).forEach((g) => {
    const ms = groups[g], nSel = ms.filter((m) => selM.has(m)).length;
    const gr = el("tr", "g"), c0 = el("td", "chk"), cb = el("input");
    cb.type = "checkbox"; cb.checked = nSel === ms.length; cb.indeterminate = nSel > 0 && nSel < ms.length;
    cb.onchange = () => { ms.forEach((m) => (cb.checked ? selM.add(m) : selM.delete(m))); refresh(); };
    c0.append(cb);
    const c1 = el("td"); c1.colSpan = 4; c1.textContent = `${g} (${nSel}/${ms.length})`;
    gr.append(c0, c1); gr.onclick = (e) => { if (e.target !== cb) { cb.checked = !(nSel === ms.length); cb.onchange(); } };
    body.append(gr);
    ms.forEach((m) => {
      const tr = el("tr", "m" + (selM.has(m) ? " on" : "")), c = el("input"); c.type = "checkbox"; c.checked = selM.has(m);
      c.onchange = () => { c.checked ? selM.add(m) : selM.delete(m); refresh(); };
      const t0 = el("td", "chk"); t0.append(c);
      const t1 = el("td", "sym"); t1.textContent = m;
      const t2 = el("td", "hide-s"); t2.textContent = (meta[m] && meta[m].name) || "";
      const t3 = el("td", "num"); t3.textContent = `${range[m][0]} - ${range[m][1]}`;
      const t4 = el("td", "cnt"); t4.textContent = counts[m] || 0;
      tr.append(t0, t1, t2, t3, t4);
      tr.onclick = (e) => { if (e.target !== c) { c.checked = !c.checked; c.onchange(); } };
      body.append(tr);
    });
  });
}

function refresh() {
  counts = {};
  files.forEach((f) => { if (inScope(f)) counts[f.market] = (counts[f.market] || 0) + 1; });
  renderMarkets();
  $("from").value = from; $("to").value = to;
  $("from").disabled = $("to").disabled = false;
  $("sides").innerHTML = "";
  [["both", "Bid + Ask"], ["bid", "Bid only"], ["ask", "Ask only"]].forEach(([v, t]) => {
    const l = el("label"), r = el("input"); r.type = "radio"; r.name = "side"; r.checked = side === v;
    r.onchange = () => { side = v; refresh(); };
    l.append(r, document.createTextNode(t)); $("sides").append(l);
  });
  const list = filtered(), total = list.reduce((s, f) => s + f.size, 0);
  $("mcount").textContent = `${selM.size}/${markets.length} selected`;
  $("summary").textContent = `${selM.size} markets, ${list.length} files, ${fmt(total)}${latestOnly ? " (latest year each)" : ""}`;
  $("zip").disabled = !list.length || demo;
  $("rows").innerHTML = list.map((f) =>
    `<tr><td><a href="/dl/${f.name}" data-n="${f.name}">${f.name}</a></td><td>${fmt(f.size)}</td><td>${f.updated.slice(0, 10)}</td></tr>`).join("");
}

const strip = (s) => s.replace(/,[^,\r\n]*(?=\r?\n|$)/g, "");
function processStream(body, withVolume, onBytes) {
  const dec = new TextDecoder(), enc = new TextEncoder();
  let buf = "", first = true, doStrip = false;
  return body.pipeThrough(new TransformStream({
    transform(chunk, c) {
      onBytes && onBytes(chunk.length);
      if (withVolume) return c.enqueue(chunk);
      buf += dec.decode(chunk, { stream: true });
      if (first) { const nl = buf.indexOf("\n"); if (nl < 0) return; doStrip = /volume/i.test(buf.slice(0, nl)); first = false; }
      const i = buf.lastIndexOf("\n"); if (i < 0) return;
      const part = buf.slice(0, i + 1); buf = buf.slice(i + 1);
      c.enqueue(enc.encode(doStrip ? strip(part) : part));
    },
    flush(c) { if (!withVolume && buf) c.enqueue(enc.encode(doStrip ? strip(buf) : buf)); },
  }));
}
function saveBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

$("rows").addEventListener("click", async (e) => {
  const a = e.target.closest("a[data-n]"); if (!a) return;
  if (demo) { e.preventDefault(); return; }
  if ($("vol").checked) return;
  e.preventDefault();
  $("status").textContent = "Preparing " + a.dataset.n + "...";
  const r = await fetch("/dl/" + a.dataset.n);
  if (!r.ok) { $("status").textContent = "Error " + r.status; return; }
  saveBlob(await new Response(processStream(r.body, false)).blob(), a.dataset.n);
  $("status").textContent = "Done.";
});

async function startZip() {
  if (demo) { $("status").textContent = "Demo mode: real file nai."; return; }
  const list = filtered(); if (!list.length) return;
  const withVol = $("vol").checked, total = list.reduce((s, f) => s + f.size, 0);
  let done = 0, n = 0; const t0 = Date.now();
  $("zip").disabled = $("latestAll").disabled = true;
  const zipName = "dukascopy-m1-" + new Date().toISOString().slice(0, 10) + ".zip";

  async function* gen() {
    for (const f of list) {
      n++;
      const r = await fetch("/dl/" + f.name);
      if (!r.ok) throw new Error(f.name + " failed: " + r.status);
      const body = processStream(r.body, withVol, (b) => {
        done += b;
        const pct = Math.min(100, (done / total) * 100), sp = done / 1e6 / Math.max(1, (Date.now() - t0) / 1000);
        $("pbar").style.width = pct + "%";
        $("status").textContent = `[${n}/${list.length}] ${f.name} | ${pct.toFixed(0)}% | ${sp.toFixed(1)} MB/s`;
      });
      yield { name: `${f.market}/${f.name}`, lastModified: new Date(f.updated), input: new Response(body) };
    }
  }
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: zipName, types: [{ description: "ZIP", accept: { "application/zip": [".zip"] } }] });
      await downloadZip(gen()).body.pipeTo(await h.createWritable());
    } else saveBlob(await downloadZip(gen()).blob(), zipName);
    $("pbar").style.width = "100%"; $("status").textContent = "Done.";
  } catch (e) {
    $("status").textContent = e.name === "AbortError" ? "Cancelled." : "Error: " + e.message;
  }
  $("latestAll").disabled = false; refresh();
}

function demoFiles() {
  const out = [], cy = new Date().getFullYear();
  Object.keys(meta).forEach((m, i) => {
    const start = ["BTCUSD", "ETHUSD", "LTCUSD"].includes(m) ? 2017 : 2003 + ((i * 3) % 10);
    for (let y = start; y <= cy; y++) ["bid", "ask"].forEach((s) =>
      out.push({ name: `${m}_${y}_${s}.csv`, id: 0, market: m, year: y, side: s, size: 18e6 + ((i * 7 + y) % 20) * 1e6, updated: `${y === cy ? cy : y + 1}-01-03T06:00:00Z` }));
  });
  return out;
}

async function init() {
  try { meta = await (await fetch("/markets.json")).json(); } catch { meta = {}; }
  if (demo) { files = demoFiles(); $("demoBanner").innerHTML = '<div class="demo">Demo mode: UI preview-er jonno fake file list. Download off.</div>'; }
  else {
    const r = await fetch("/api/files");
    if (!r.ok) { $("meta").textContent = "File list load hoyni (" + r.status + ")"; return; }
    files = await r.json();
  }
  if (!files.length) {
    $("meta").textContent = "Ekhono kono data upload hoyni. Backfill cholche, kichukkhon pore reload dao. (UI dekhte URL-er sheshe ?demo)";
    $("zip").disabled = $("latestAll").disabled = true; return;
  }
  markets = [...new Set(files.map((f) => f.market))].sort();
  years = [...new Set(files.map((f) => f.year))].sort((a, b) => a - b);
  markets.forEach((m) => {
    const ys = files.filter((f) => f.market === m).map((f) => f.year);
    range[m] = [Math.min(...ys), Math.max(...ys)]; maxY[m] = range[m][1];
  });
  $("from").innerHTML = $("to").innerHTML = years.map((y) => `<option>${y}</option>`).join("");
  selM = new Set(markets); from = to = years[years.length - 1];
  const last = files.map((f) => f.updated).sort().pop();
  $("meta").textContent = `${markets.length} markets, ${years[0]}-${years[years.length - 1]}, last update ${last.slice(0, 10)}, timezone UTC`;
  refresh();
}

$("mAll").onclick = () => { selM = new Set(markets); refresh(); };
$("mNone").onclick = () => { selM = new Set(); refresh(); };
$("from").onchange = (e) => { from = +e.target.value; if (to < from) to = from; latestOnly = false; refresh(); };
$("to").onchange = (e) => { to = +e.target.value; if (from > to) from = to; latestOnly = false; refresh(); };
document.querySelectorAll("[data-p]").forEach((b) => (b.onclick = () => {
  const p = b.dataset.p, last = years[years.length - 1]; latestOnly = false;
  if (p === "latest") from = to = last;
  else if (p === "all") { from = years[0]; to = last; }
  else { to = last; from = Math.max(years[0], last - (+p - 1)); }
  refresh();
}));
$("zip").onclick = startZip;
$("latestAll").onclick = () => { selM = new Set(markets); side = "both"; latestOnly = true; refresh(); startZip(); };

init();
</script>
</body>
</html>
