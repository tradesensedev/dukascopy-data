<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dukascopy M1 Data</title>
<style>
:root{--ink:#17150f;--mut:#7a7563;--line:#ddd6c1;--bg:#f6f2e6;--card:#fffdf6;--acc:#8b1a1a;--link:#1b3a8a;--hov:#efe9d5;--warn:#fff0c2}
@media (prefers-color-scheme:dark){:root{--ink:#ece6d2;--mut:#9a947e;--line:#3d3b30;--bg:#1a1913;--card:#22211a;--acc:#ff8a73;--link:#8fb0ff;--hov:#2b2a21;--warn:#3e3410}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.5 Georgia,"Times New Roman",serif}
.wrap{max-width:1060px;margin:0 auto;padding:0 18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 0 10px;border-bottom:1px solid var(--ink)}
.logo{font-weight:700;font-size:19px}
.logo i{font:700 12px ui-monospace,Consolas,monospace;font-style:normal;background:var(--ink);color:var(--bg);padding:2px 6px;margin-right:8px}
#stats{font:12px ui-monospace,Consolas,monospace;color:var(--mut)}
.intro{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0 20px}
h1{margin:0;font-size:24px;font-weight:700;line-height:1.2}
.sub{color:var(--mut);margin:2px 0 0;font-style:italic}
.btn{font:inherit;font-weight:700;color:var(--ink);background:transparent;border:1px solid var(--ink);padding:6px 14px;cursor:pointer;white-space:nowrap;border-radius:0;transition:background .12s,color .12s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{border-color:var(--acc);color:var(--acc)}
.btn.danger:hover{background:var(--acc);color:#fff}
.btn.wide{width:100%;padding:9px;font-size:15px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:disabled:hover{background:transparent;color:var(--ink)}
.btn.primary:disabled:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:1fr 270px;gap:34px;align-items:start}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--mut)}
.cnt{font:12px ui-monospace,Consolas,monospace;color:var(--mut)}
.tl,.link{background:none;border:0;color:var(--link);font:inherit;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.tl:hover,.link:hover{color:var(--acc)}
.tl.act{color:var(--ink);font-weight:700;text-decoration:none;cursor:default}
.tools .sp{flex:1}
.grp{margin-top:16px}
.gh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.gh h3{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--mut)}
.gh small{font:11px ui-monospace,Consolas,monospace;color:var(--mut)}
.gh .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.chip{position:relative;display:block;background:var(--card);border:1px solid var(--line);padding:5px 9px;cursor:pointer;user-select:none;transition:background .1s,border-color .1s}
.chip:hover{border-color:var(--ink)}
.chip input{position:absolute;opacity:0}
.chip b{display:block;font:700 13px ui-monospace,Consolas,monospace}
.chip span{display:block;font:11px ui-monospace,Consolas,monospace;color:var(--mut)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on span{color:var(--bg);opacity:.65}
.chip.off{opacity:.4}
.chip:has(input:focus-visible){outline:2px dotted var(--acc);outline-offset:2px}
.side{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;padding-left:22px;border-left:1px solid var(--line)}
.sec{margin-bottom:20px}
.sec .lbl{display:block;margin-bottom:8px}
.pre{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px}
.pre button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);padding:3px;cursor:pointer;border-radius:0}
.pre button:hover{border-color:var(--ink)}
.pre button.act{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ft{display:flex;align-items:center;gap:8px}
.ft select{flex:1;min-width:0}
.ft em{color:var(--mut)}
select{font:13px ui-monospace,Consolas,monospace;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:0;padding:4px 6px;cursor:pointer}
select:hover{border-color:var(--ink)}
select:focus{outline:2px dotted var(--acc);outline-offset:1px}
select:disabled{opacity:.4}
.seg{display:flex;border:1px solid var(--line)}
.seg label{flex:1;position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:4px;font-size:13px}
.seg label:hover span{background:var(--hov)}
.seg input:checked+span{background:var(--ink);color:var(--bg);font-weight:700}
.seg input:focus-visible+span{outline:2px dotted var(--acc);outline-offset:-3px}
.opt{display:flex;align-items:flex-start;gap:8px;cursor:pointer;margin-top:8px}
.opt input{width:15px;height:15px;margin:3px 0 0;accent-color:var(--ink);cursor:pointer;flex:none}
.opt small{color:var(--mut);display:block;font-size:12px;line-height:1.2}
.sum{margin-bottom:10px}
.sum b{font:700 16px ui-monospace,Consolas,monospace;display:block}
.sum span{color:var(--mut);font-size:12px}
.note{display:none;background:var(--warn);padding:5px 8px;font-size:12.5px;margin-bottom:8px}
.note.show{display:block}
.btns{display:flex;gap:6px}
.btns .primary{flex:1}
.prog{height:4px;background:var(--line);margin-top:10px;display:none}
.prog.show{display:block}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
#status{font:11.5px ui-monospace,Consolas,monospace;color:var(--mut);margin-top:6px;display:none;word-break:break-all}
#status.show{display:block}
details.files{margin:26px 0 90px}
details.files summary{cursor:pointer;color:var(--link);text-decoration:underline;text-underline-offset:2px;width:max-content}
.tbl{max-height:280px;overflow:auto;margin-top:8px;border:1px solid var(--line);background:var(--card)}
table{width:100%;border-collapse:collapse;font:12.5px ui-monospace,Consolas,monospace}
th{position:sticky;top:0;background:var(--hov);text-align:left;padding:6px 12px}
td{padding:4px 12px;border-top:1px solid var(--line)}
td a{color:var(--link)}
td a:hover{color:var(--acc)}
.empty{text-align:center;padding:40px 20px;border:1px dashed var(--line);color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.demo{background:var(--hov);border:1px solid var(--line);padding:0 8px;font:11.5px ui-monospace,Consolas,monospace;font-style:normal}
.mbar{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:18px}
  .side{position:static;max-height:none;padding:18px 0 0;border-left:0;border-top:1px solid var(--line)}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-top:1px solid var(--ink);padding:8px 16px}
  .mbar div{font-weight:700;font-size:13px}.mbar small{display:block;color:var(--mut);font-weight:400;font-size:11.5px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  details.files{margin-bottom:100px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i>M1</i>Dukascopy Data</div>
    <div id="stats"></div>
  </header>

  <div class="intro" id="quick">
    <div>
      <h1>1-minute market data</h1>
      <p class="sub">Bid, ask &amp; volume &middot; UTC &middot; updated weekly <span id="demoTag"></span></p>
    </div>
    <div class="quick">
      <button class="btn primary" id="qAll">Latest year &middot; all markets</button>
      <button class="btn" id="qSel">Latest year &middot; selected</button>
    </div>
  </div>

  <div id="app" class="layout">
    <div>
      <div class="tools">
        <span class="lbl">Markets</span><span class="cnt" id="mcount"></span>
        <button class="tl" id="mAll">All</button>
        <button class="tl" id="mNone">None</button>
        <button class="tl" id="mInv">Invert</button>
        <span class="sp"></span>
        <span class="cnt">Only:</span>
        <span id="only" style="display:contents"></span>
      </div>
      <div id="mlist"></div>
    </div>

    <aside class="side">
      <div class="sec">
        <span class="lbl">Period</span>
        <div class="pre" id="presets"></div>
        <div class="ft"><select id="from"></select><em>to</em><select id="to"></select></div>
      </div>
      <div class="sec">
        <span class="lbl">Price &amp; output</span>
        <div class="seg" id="sides"></div>
        <label class="opt"><input type="checkbox" id="vol" checked><span>Include volume</span></label>
        <label class="opt"><input type="checkbox" id="folders" checked><span>Folder per market<small>OFF dile shob file ek folder-e</small></span></label>
      </div>
      <div class="sec" style="margin-bottom:0">
        <div class="sum"><b id="sumA">-</b><span id="sumB"></span></div>
        <div class="note" id="note"></div>
        <div class="btns">
          <button class="btn primary wide" id="zip">Download ZIP</button>
          <button class="btn danger" id="cancel" style="display:none">Cancel</button>
        </div>
        <div class="prog" id="bar"><i id="pbar"></i></div>
        <div id="status"></div>
      </div>
    </aside>
  </div>

  <div id="emptyBox"></div>

  <details class="files" id="filesBox">
    <summary>Browse individual files</summary>
    <div class="tbl"><table><thead><tr><th>File</th><th>Size</th><th>Updated</th></tr></thead><tbody id="rows"></tbody></table></div>
  </details>
</div>

<div class="mbar" id="mbar">
  <div id="mSum">-</div>
  <button class="btn primary" id="zip2">Download ZIP</button>
</div>

<script type="module">
import { downloadZip } from "https://cdn.jsdelivr.net/npm/client-zip@2.4.5/index.js";

const $ = (id) => document.getElementById(id);
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
const fmt = (b) => (b > 1e9 ? (b / 1e9).toFixed(2) + " GB" : (b / 1e6).toFixed(0) + " MB");
const GROUP_ORDER = ["Forex Majors", "Forex Crosses", "Crypto", "Metals & Energy", "Indices", "Other"];
const SHORT = { "Forex Majors": "FX Majors", "Forex Crosses": "FX Crosses", "Metals & Energy": "Metals/Energy" };
const demo = new URLSearchParams(location.search).has("demo");
const KEY = "dukascopy-m1-v2";

let files = [], meta = {}, markets = [], years = [], range = {}, maxY = {}, groups = {};
let selM = new Set(), from = 0, to = 0, side = "both", latestOnly = true, busy = false, ctrl = null;

const inScope = (f) => (side === "both" || f.side === side) &&
  (latestOnly ? f.year === maxY[f.market] : f.year >= from && f.year <= to);
const filtered = () => files.filter((f) => selM.has(f.market) && inScope(f))
  .sort((a, b) => a.market.localeCompare(b.market) || a.year - b.year || a.side.localeCompare(b.side));

function save() {
  if (demo) return;
  try { localStorage.setItem(KEY, JSON.stringify({ m: [...selM], from, to, side, latestOnly, vol: $("vol").checked, folders: $("folders").checked })); } catch {}
}
function load() {
  try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; }
}

function renderMarkets() {
  const root = $("mlist"); root.innerHTML = "";
  GROUP_ORDER.filter((g) => groups[g]).forEach((g) => {
    const ms = groups[g], n = ms.filter((m) => selM.has(m)).length, all = n === ms.length;
    const sec = el("div", "grp"), gh = el("div", "gh");
    const h = el("h3"); h.textContent = g;
    const sm = el("small"); sm.textContent = `${n}/${ms.length}`;
    const tg = el("button", "link"); tg.textContent = all ? "clear" : "select all";
    tg.onclick = () => { ms.forEach((m) => (all ? selM.delete(m) : selM.add(m))); refresh(); };
    gh.append(h, sm, el("span", "sp"), tg); sec.append(gh);
    const grid = el("div", "grid");
    ms.forEach((m) => {
      const on = selM.has(m);
      const hasData = latestOnly || (range[m][1] >= from && range[m][0] <= to);
      const chip = el("label", "chip" + (on ? " on" : "") + (!hasData ? " off" : ""));
      chip.title = ((meta[m] && meta[m].name) || m) + (hasData ? "" : " (no data in this period)");
      const c = el("input"); c.type = "checkbox"; c.checked = on;
      c.onchange = () => { c.checked ? selM.add(m) : selM.delete(m); refresh(); };
      const b = el("b"); b.textContent = m;
      const s = el("span"); s.textContent = `${range[m][0]}\u2013${range[m][1]}`;
      chip.append(c, b, s); grid.append(chip);
    });
    sec.append(grid); root.append(sec);
  });
}

function renderOnly() {
  $("only").innerHTML = "";
  GROUP_ORDER.filter((g) => groups[g]).forEach((g) => {
    const ms = groups[g];
    const active = selM.size === ms.length && ms.every((m) => selM.has(m));
    const b = el("button", "tl" + (active ? " act" : "")); b.textContent = SHORT[g] || g;
    b.onclick = () => { selM = new Set(ms); refresh(); };
    $("only").append(b);
  });
}

function renderControls() {
  const last = years[years.length - 1];
  const p3 = Math.max(years[0], last - 2), p5 = Math.max(years[0], last - 4);
  const active = latestOnly ? "latest" : to === last && from === p3 ? "3" : to === last && from === p5 ? "5" :
    from === years[0] && to === last ? "all" : "";
  $("presets").innerHTML = "";
  [["latest", "Latest year"], ["3", "Last 3 yrs"], ["5", "Last 5 yrs"], ["all", "Full history"]].forEach(([k, t]) => {
    const b = el("button", active === k ? "act" : ""); b.textContent = t;
    b.onclick = () => {
      latestOnly = k === "latest";
      if (k === "all") { from = years[0]; to = last; }
      else if (k !== "latest") { to = last; from = Math.max(years[0], last - (+k - 1)); }
      refresh();
    };
    $("presets").append(b);
  });
  $("from").value = from; $("to").value = to;
  $("from").disabled = $("to").disabled = latestOnly;
  $("sides").innerHTML = "";
  [["both", "Bid + Ask"], ["bid", "Bid"], ["ask", "Ask"]].forEach(([v, t]) => {
    const l = el("label"), r = el("input"); r.type = "radio"; r.name = "side"; r.checked = side === v;
    r.onchange = () => { side = v; refresh(); };
    const s = el("span"); s.textContent = t; l.append(r, s); $("sides").append(l);
  });
}

function refresh() {
  renderMarkets(); renderOnly(); renderControls();
  const list = filtered(), total = list.reduce((s, f) => s + f.size, 0);
  const nm = new Set(list.map((f) => f.market)).size;
  $("mcount").textContent = `${selM.size}/${markets.length}`;
  $("sumA").textContent = `${list.length} files \u00b7 ${fmt(total)}`;
  $("sumB").textContent = `${nm} markets \u00b7 ` + (latestOnly ? "latest year each" : from === to ? from : `${from}\u2013${to}`);
  $("mSum").innerHTML = busy ? "Downloading..." : `${list.length} files<small>${fmt(total)}</small>`;
  let note = "";
  if (!selM.size) note = "Kom-pokkhe ekta market select koro.";
  else if (!list.length) note = "Selected market gulo-te ei period-e data nai.";
  else if (total > 1.5e9 && !window.showSaveFilePicker) note = "Boro download: Chrome ba Edge use koro, nahole puro ZIP RAM-e thakbe.";
  $("note").textContent = note; $("note").classList.toggle("show", !!note);
  $("zip").disabled = busy || !list.length || demo;
  $("zip2").disabled = demo || (!busy && !list.length);
  $("zip2").textContent = busy ? "Cancel" : "Download ZIP";
  $("qAll").disabled = busy || demo; $("qSel").disabled = busy || demo || !selM.size;
  $("cancel").style.display = busy ? "" : "none";
  $("rows").innerHTML = list.map((f) =>
    `<tr><td><a href="/dl/${f.name}" data-n="${f.name}">${f.name}</a></td><td>${fmt(f.size)}</td><td>${f.updated.slice(0, 10)}</td></tr>`).join("");
  save();
}

// volume column strip (browser-e)
const strip = (s) => s.replace(/,[^,\r\n]*(?=\r?\n|$)/g, "");
function processStream(body, withVolume, onBytes) {
  const dec = new TextDecoder(), enc = new TextEncoder();
  let buf = "", first = true, doStrip = false;
  return body.pipeThrough(new TransformStream({
    transform(chunk, c) {
      onBytes && onBytes(chunk.length);
      if (withVolume) return c.enqueue(chunk);
      buf += dec.decode(chunk, { stream: true });
      if (first) { const nl = buf.indexOf("\n"); if (nl < 0) return; doStrip = /volume/i.test(buf.slice(0, nl)); first = false; }
      const i = buf.lastIndexOf("\n"); if (i < 0) return;
      const part = buf.slice(0, i + 1); buf = buf.slice(i + 1);
      c.enqueue(enc.encode(doStrip ? strip(part) : part));
    },
    flush(c) { if (!withVolume && buf) c.enqueue(enc.encode(doStrip ? strip(buf) : buf)); },
  }));
}
function saveBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
const say = (t) => { $("status").textContent = t; $("status").classList.add("show"); };

$("rows").addEventListener("click", async (e) => {
  const a = e.target.closest("a[data-n]"); if (!a) return;
  if (demo) { e.preventDefault(); return; }
  if ($("vol").checked) return;
  e.preventDefault(); say("Preparing " + a.dataset.n + "...");
  const r = await fetch("/dl/" + a.dataset.n);
  if (!r.ok) return say("Error " + r.status);
  saveBlob(await new Response(processStream(r.body, false)).blob(), a.dataset.n);
  say("Done.");
});

async function startZip() {
  if (demo) return say("Demo mode: real file nai.");
  const list = filtered(); if (!list.length || busy) return;
  const withVol = $("vol").checked, perFolder = $("folders").checked;
  const total = list.reduce((s, f) => s + f.size, 0);
  let done = 0, n = 0; const t0 = Date.now();
  ctrl = new AbortController(); const signal = ctrl.signal;
  busy = true; refresh();
  $("bar").classList.add("show"); $("pbar").style.width = "0";
  const zipName = "dukascopy-m1-" + new Date().toISOString().slice(0, 10) + ".zip";

  async function* gen() {
    for (const f of list) {
      n++;
      const r = await fetch("/dl/" + f.name, { signal });
      if (!r.ok) throw new Error(f.name + " failed: " + r.status);
      const body = processStream(r.body, withVol, (b) => {
        done += b;
        const pct = Math.min(100, (done / total) * 100), sp = done / 1e6 / Math.max(1, (Date.now() - t0) / 1000);
        $("pbar").style.width = pct + "%";
        say(`${n}/${list.length} \u00b7 ${f.name} \u00b7 ${pct.toFixed(0)}% \u00b7 ${sp.toFixed(1)} MB/s`);
      });
      yield { name: perFolder ? `${f.market}/${f.name}` : f.name, lastModified: new Date(f.updated), input: new Response(body) };
    }
  }
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: zipName, types: [{ description: "ZIP", accept: { "application/zip": [".zip"] } }] });
      await downloadZip(gen()).body.pipeTo(await h.createWritable(), { signal });
    } else saveBlob(await downloadZip(gen()).blob(), zipName);
    $("pbar").style.width = "100%"; say("Done. ZIP saved.");
  } catch (e) {
    say(signal.aborted || e.name === "AbortError" ? "Cancelled." : "Error: " + e.message);
  }
  busy = false; ctrl = null; refresh();
}
const cancelZip = () => ctrl && ctrl.abort();

function demoFiles() {
  const out = [], cy = new Date().getFullYear();
  Object.keys(meta).forEach((m, i) => {
    const start = ["BTCUSD", "ETHUSD", "LTCUSD"].includes(m) ? 2017 : 2003 + ((i * 3) % 10);
    for (let y = start; y <= cy; y++) ["bid", "ask"].forEach((s) =>
      out.push({ name: `${m}_${y}_${s}.csv`, id: 0, market: m, year: y, side: s, size: 18e6 + ((i * 7 + y) % 20) * 1e6, updated: `${y === cy ? cy : y + 1}-01-03T06:00:00Z` }));
  });
  return out;
}

function showEmpty(title, text) {
  $("app").style.display = "none"; $("filesBox").style.display = "none"; $("mbar").style.display = "none"; $("quick").style.display = "none";
  $("emptyBox").innerHTML = `<div class="empty"><b>${title}</b>${text}</div>`;
}

async function init() {
  try { meta = await (await fetch("/markets.json")).json(); } catch { meta = {}; }
  if (demo) { files = demoFiles(); $("demoTag").innerHTML = '<span class="demo">demo</span>'; }
  else {
    let r; try { r = await fetch("/api/files"); } catch { r = { ok: false, status: "network" }; }
    if (!r.ok) return showEmpty("Could not load the file list", "Error " + r.status + ". Kichukkhon pore reload koro.");
    files = await r.json();
  }
  if (!files.length) return showEmpty("Data is being prepared", "Backfill cholche. Kichukkhon pore reload dao.");

  markets = [...new Set(files.map((f) => f.market))].sort();
  years = [...new Set(files.map((f) => f.year))].sort((a, b) => a - b);
  markets.forEach((m) => {
    const ys = files.filter((f) => f.market === m).map((f) => f.year);
    range[m] = [Math.min(...ys), Math.max(...ys)]; maxY[m] = range[m][1];
    const g = (meta[m] && meta[m].group) || "Other"; (groups[g] = groups[g] || []).push(m);
  });
  $("from").innerHTML = $("to").innerHTML = years.map((y) => `<option>${y}</option>`).join("");
  selM = new Set(markets); from = to = years[years.length - 1]; latestOnly = true;

  const s = !demo && load();
  if (s) {
    selM = new Set((s.m || []).filter((x) => markets.includes(x)));
    if (years.includes(s.from) && years.includes(s.to) && s.from <= s.to) { from = s.from; to = s.to; }
    if (["both", "bid", "ask"].includes(s.side)) side = s.side;
    latestOnly = s.latestOnly !== false;
    $("vol").checked = s.vol !== false; $("folders").checked = s.folders !== false;
  }

  const last = files.map((f) => f.updated).sort().pop();
  $("stats").textContent = [`${markets.length} markets`, `${years[0]}\u2013${years[years.length - 1]}`,
    fmt(files.reduce((s, f) => s + f.size, 0)), `updated ${last.slice(0, 10)}`].join(" \u00b7 ");
  refresh();
}

$("mAll").onclick = () => { selM = new Set(markets); refresh(); };
$("mNone").onclick = () => { selM = new Set(); refresh(); };
$("mInv").onclick = () => { selM = new Set(markets.filter((m) => !selM.has(m))); refresh(); };
$("from").onchange = (e) => { from = +e.target.value; if (to < from) to = from; latestOnly = false; refresh(); };
$("to").onchange = (e) => { to = +e.target.value; if (from > to) from = to; latestOnly = false; refresh(); };
$("vol").onchange = $("folders").onchange = refresh;
$("zip").onclick = startZip;
$("cancel").onclick = cancelZip;
$("zip2").onclick = () => (busy ? cancelZip() : startZip());
$("qAll").onclick = () => { selM = new Set(markets); latestOnly = true; refresh(); startZip(); };
$("qSel").onclick = () => { if (!selM.size) return; latestOnly = true; refresh(); startZip(); };

init();
</script>
</body>
</html>
