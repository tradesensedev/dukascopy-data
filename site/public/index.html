<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dukascopy M1 Data</title>
<style>
:root{--desk:#008080;--face:#c0c0c0;--face2:#dcdcdc;--hi:#fff;--sh:#808080;--dk:#000;--txt:#000;--field:#fff;--t1:#000080;--t2:#1084d0;--selbg:#000080;--seltx:#fff;--mut:#4d4d4d;--link:#0000cc;--warn:#ffffe1;--glow:rgba(16,132,208,.35)}
@media (prefers-color-scheme:dark){:root{--desk:#0e2a2d;--face:#2d2d33;--face2:#3a3a42;--hi:#5a5a66;--sh:#16161a;--dk:#000;--txt:#e8e8ee;--field:#1b1b20;--t1:#1b2d78;--t2:#3b6fc4;--selbg:#3b6fc4;--seltx:#fff;--mut:#a0a0ac;--link:#8fb0ff;--warn:#3d3715;--glow:rgba(59,111,196,.45)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--desk);color:var(--txt);font:13px/1.4 "Segoe UI",Tahoma,Verdana,sans-serif;padding:20px 12px 64px}
.win{max-width:1060px;margin:0 auto;background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--face2),0 24px 60px rgba(0,0,0,.4);padding:3px}
.titlebar{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,var(--t1),var(--t2));color:#fff;font-weight:700;padding:3px 4px 3px 6px;user-select:none}
.titlebar .ti{background:#fff;color:var(--t1);font:700 10px Consolas,monospace;padding:0 3px}
.titlebar .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc{display:flex;gap:2px}
.wc b{width:18px;height:16px;display:grid;place-items:center;background:var(--face);color:var(--txt);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);font:700 11px/1 Tahoma,sans-serif;cursor:default}
.menubar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:3px 6px;border-bottom:1px solid var(--sh);box-shadow:0 1px 0 var(--hi)}
#stats{font:12px Consolas,"Courier New",monospace;color:var(--mut)}
.menubar span.m{color:var(--txt)}
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px;border-bottom:1px solid var(--sh);box-shadow:0 1px 0 var(--hi)}
.toolbar .l{color:var(--mut);margin-right:2px}
.btn{font:inherit;color:var(--txt);background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--face2);padding:4px 14px;cursor:pointer;white-space:nowrap;border-radius:0;transition:filter .12s}
.btn:hover{filter:brightness(1.07)}
.btn:active{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--sh);padding:5px 13px 3px 15px}
.btn:focus-visible{outline:1px dotted var(--txt);outline-offset:-5px}
.btn.primary{font-weight:700;outline:1px solid var(--dk)}
.btn.wide{width:100%;padding:7px;font-size:14px}
.btn:disabled{color:var(--sh);text-shadow:1px 1px var(--hi);cursor:not-allowed;filter:none}
.btn.sm{padding:1px 10px}
.body{padding:8px}
.layout{display:grid;grid-template-columns:1fr 290px;gap:8px;align-items:start}
.pane{border:1px solid var(--sh);box-shadow:1px 1px 0 var(--hi);padding:8px}
.tools{position:sticky;top:0;z-index:5;background:var(--face);padding:2px 0 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tools .t{font-weight:700;margin-right:4px}
.cnt{font:12px Consolas,monospace;color:var(--mut)}
.tl{font:inherit;color:var(--txt);background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--face2);padding:0 9px;cursor:pointer;border-radius:0;transition:filter .12s}
.tl:hover{filter:brightness(1.07)}
.tl:active,.tl.act{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--sh);background:var(--face2);font-weight:700}
.tools .sp{flex:1}
.list{background:var(--field);border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px var(--dk);padding:4px 10px 12px}
.grp{margin-top:10px}
.gh{display:flex;align-items:center;gap:8px;margin-bottom:6px;border-bottom:1px solid var(--sh);box-shadow:0 1px 0 var(--hi);padding-bottom:3px}
.gh h3{margin:0;font-size:13px;font-weight:700}
.gh small{font:11px Consolas,monospace;color:var(--mut)}
.gh .sp{flex:1}
.link{background:none;border:0;color:var(--link);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.link:hover{text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.chip{position:relative;display:block;background:var(--face);color:var(--txt);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--face2);padding:3px 8px;cursor:pointer;user-select:none;transition:filter .12s,box-shadow .15s}
.chip:hover{filter:brightness(1.08)}
.chip input{position:absolute;opacity:0}
.chip b{display:block;font:700 13px Consolas,"Courier New",monospace}
.chip span{display:block;font:11px Consolas,monospace;color:var(--mut)}
.chip.on{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--sh),0 0 0 2px var(--glow);background:var(--selbg);color:var(--seltx);padding:4px 7px 2px 9px}
.chip.on span{color:var(--seltx);opacity:.75}
.chip.off{opacity:.45}
.chip:has(input:focus-visible){outline:1px dotted var(--txt);outline-offset:2px}
.side{position:sticky;top:8px;max-height:calc(100vh - 100px);overflow:auto;display:flex;flex-direction:column;gap:10px}
fieldset{margin:0;border:1px solid var(--sh);box-shadow:1px 1px 0 var(--hi);padding:8px 10px 10px;min-width:0}
legend{padding:0 4px;font-weight:700}
.pre{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px}
.pre button{font:inherit;color:var(--txt);background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--face2);padding:2px;cursor:pointer;border-radius:0;transition:filter .12s}
.pre button:hover{filter:brightness(1.07)}
.pre button.act{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--sh);background:var(--face2);font-weight:700}
.ft{display:flex;align-items:center;gap:6px}
.ft select{flex:1;min-width:0}
select{font:12.5px Consolas,monospace;color:var(--txt);background:var(--field);border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px var(--dk);border-radius:0;padding:2px 4px;cursor:pointer}
select:focus{outline:1px dotted var(--txt);outline-offset:1px}
select:disabled{color:var(--sh);background:var(--face)}
.seg{display:flex;gap:0}
.seg label{flex:1;position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:3px 2px;background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--face2);transition:filter .12s}
.seg label:hover span{filter:brightness(1.07)}
.seg input:checked+span{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--sh);background:var(--face2);font-weight:700}
.seg input:focus-visible+span{outline:1px dotted var(--txt);outline-offset:-5px}
.opt{display:flex;align-items:flex-start;gap:8px;cursor:pointer;margin-top:8px}
.opt small{display:block;color:var(--mut);font-size:11.5px;line-height:1.2}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;margin:2px 0 0;width:14px;height:14px;background:var(--field);border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px var(--dk);display:grid;place-items:center;cursor:pointer}
input[type=checkbox]:checked::after{content:"";width:3px;height:7px;border:solid var(--txt);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
input[type=checkbox]:focus-visible{outline:1px dotted var(--txt);outline-offset:2px}
.sum{background:var(--field);border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px var(--dk);padding:5px 8px;margin-bottom:8px}
.sum b{font:700 15px Consolas,monospace;display:block}
.sum span{color:var(--mut);font-size:12px}
.note{display:none;background:var(--warn);border:1px solid var(--dk);padding:4px 8px;font-size:12px;margin-bottom:8px}
.note.show{display:block}
.btns{display:flex;gap:6px}
.btns .primary{flex:1}
.prog{height:18px;margin-top:8px;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px var(--dk);background:var(--field);padding:1px;display:none}
.prog.show{display:block}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--selbg) 0 8px,transparent 8px 10px);transition:width .2s}
#status{font:11.5px Consolas,monospace;color:var(--mut);margin-top:6px;display:none;word-break:break-all}
#status.show{display:block}
details.files{margin-top:8px}
details.files summary{cursor:pointer;font-weight:700;padding:2px 4px;width:max-content;user-select:none}
.tbl{max-height:280px;overflow:auto;margin-top:6px;background:var(--field);border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px var(--dk)}
table{width:100%;border-collapse:collapse;font:12px Consolas,monospace}
th{position:sticky;top:0;background:var(--face);text-align:left;padding:3px 10px;border-bottom:2px solid var(--sh);font-family:"Segoe UI",Tahoma,sans-serif;font-weight:400}
td{padding:2px 10px}
tbody tr:hover{background:var(--selbg);color:var(--seltx)}
tbody tr:hover a{color:var(--seltx)}
td a{color:var(--link)}
.statusbar{display:flex;gap:3px;padding:3px 0 0}
.statusbar div{border:1px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);padding:1px 8px;font-size:12px;color:var(--mut)}
.statusbar div:first-child{flex:1}
.empty{text-align:center;padding:30px 20px;background:var(--field);border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);color:var(--mut)}
.empty b{display:block;color:var(--txt);font-size:15px;margin-bottom:4px}
.demo{background:var(--warn);border:1px solid var(--dk);padding:0 6px;font:11px Consolas,monospace;color:#000}
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:8px;height:36px;background:var(--face);border-top:2px solid var(--hi);box-shadow:0 -1px 0 var(--sh);padding:3px 6px}
.mbar .btn{padding:2px 12px;font-weight:700}
#mSum{flex:1;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);padding:3px 10px}
#mSum small{margin-left:8px;color:var(--mut)}
#clock{border:1px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);padding:3px 10px;font:12px Consolas,monospace}
@media (max-width:860px){
  body{padding:0 0 44px}
  .win{border-width:0;box-shadow:none;max-width:none}
  .layout{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  #clock{display:none}
  .menubar{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="win">
  <div class="titlebar"><span class="ti">M1</span><span class="tt">Dukascopy Data Explorer - 1-minute bid / ask / volume</span><span class="wc" aria-hidden="true"><b>_</b><b>&#9633;</b><b>&times;</b></span></div>
  <div class="menubar"><span class="m">Data &middot; UTC &middot; updated weekly <span id="demoTag"></span></span><div id="stats"></div></div>

  <div class="toolbar" id="quick">
    <span class="l">Quick:</span>
    <button class="btn primary" id="qAll">Latest year &middot; all markets</button>
    <button class="btn" id="qSel">Latest year &middot; selected</button>
  </div>

  <div class="body">
    <div id="app" class="layout">
      <div class="pane">
        <div class="tools">
          <span class="t">Markets</span><span class="cnt" id="mcount"></span>
          <button class="tl" id="mAll">All</button>
          <button class="tl" id="mNone">None</button>
          <button class="tl" id="mInv">Invert</button>
          <span class="sp"></span>
          <span class="cnt">Only:</span>
          <span id="only" style="display:contents"></span>
        </div>
        <div class="list" id="mlist"></div>
      </div>

      <aside class="side">
        <fieldset>
          <legend>Period</legend>
          <div class="pre" id="presets"></div>
          <div class="ft"><select id="from"></select><span>to</span><select id="to"></select></div>
        </fieldset>
        <fieldset>
          <legend>Price &amp; output</legend>
          <div class="seg" id="sides"></div>
          <label class="opt"><input type="checkbox" id="vol" checked><span>Include volume</span></label>
          <label class="opt"><input type="checkbox" id="folders" checked><span>Folder per market<small>OFF dile shob file ek folder-e</small></span></label>
        </fieldset>
        <fieldset>
          <legend>Download</legend>
          <div class="sum"><b id="sumA">-</b><span id="sumB"></span></div>
          <div class="note" id="note"></div>
          <div class="btns">
            <button class="btn primary wide" id="zip">Download ZIP</button>
            <button class="btn" id="cancel" style="display:none">Cancel</button>
          </div>
          <div class="prog" id="bar"><i id="pbar"></i></div>
          <div id="status"></div>
        </fieldset>
      </aside>
    </div>

    <div id="emptyBox"></div>

    <details class="files" id="filesBox">
      <summary>Browse individual files</summary>
      <div class="tbl"><table><thead><tr><th>File</th><th>Size</th><th>Updated</th></tr></thead><tbody id="rows"></tbody></table></div>
    </details>
  </div>

  <div class="statusbar"><div id="sb1">Ready</div><div id="sb2">-</div><div id="sb3">-</div></div>
</div>

<div class="mbar" id="mbar">
  <button class="btn" id="zip2">Download ZIP</button>
  <div id="mSum">-</div>
  <div id="clock"></div>
</div>

<script type="module">
import { downloadZip } from "https://cdn.jsdelivr.net/npm/client-zip@2.4.5/index.js";

const $ = (id) => document.getElementById(id);
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
const fmt = (b) => (b > 1e9 ? (b / 1e9).toFixed(2) + " GB" : (b / 1e6).toFixed(0) + " MB");
const GROUP_ORDER = ["Forex Majors", "Forex Crosses", "Crypto", "Metals & Energy", "Indices", "Other"];
const SHORT = { "Forex Majors": "FX Majors", "Forex Crosses": "FX Crosses", "Metals & Energy": "Metals/Energy" };
const demo = new URLSearchParams(location.search).has("demo");
const KEY = "dukascopy-m1-v2";

let files = [], meta = {}, markets = [], years = [], range = {}, maxY = {}, groups = {};
let selM = new Set(), from = 0, to = 0, side = "both", latestOnly = true, busy = false, ctrl = null;

const inScope = (f) => (side === "both" || f.side === side) &&
  (latestOnly ? f.year === maxY[f.market] : f.year >= from && f.year <= to);
const filtered = () => files.filter((f) => selM.has(f.market) && inScope(f))
  .sort((a, b) => a.market.localeCompare(b.market) || a.year - b.year || a.side.localeCompare(b.side));

function save() {
  if (demo) return;
  try { localStorage.setItem(KEY, JSON.stringify({ m: [...selM], from, to, side, latestOnly, vol: $("vol").checked, folders: $("folders").checked })); } catch {}
}
function load() {
  try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; }
}

function renderMarkets() {
  const root = $("mlist"); root.innerHTML = "";
  GROUP_ORDER.filter((g) => groups[g]).forEach((g) => {
    const ms = groups[g], n = ms.filter((m) => selM.has(m)).length, all = n === ms.length;
    const sec = el("div", "grp"), gh = el("div", "gh");
    const h = el("h3"); h.textContent = g;
    const sm = el("small"); sm.textContent = `${n}/${ms.length}`;
    const tg = el("button", "link"); tg.textContent = all ? "clear" : "select all";
    tg.onclick = () => { ms.forEach((m) => (all ? selM.delete(m) : selM.add(m))); refresh(); };
    gh.append(h, sm, el("span", "sp"), tg); sec.append(gh);
    const grid = el("div", "grid");
    ms.forEach((m) => {
      const on = selM.has(m);
      const hasData = latestOnly || (range[m][1] >= from && range[m][0] <= to);
      const chip = el("label", "chip" + (on ? " on" : "") + (!hasData ? " off" : ""));
      chip.title = ((meta[m] && meta[m].name) || m) + (hasData ? "" : " (no data in this period)");
      const c = el("input"); c.type = "checkbox"; c.checked = on;
      c.onchange = () => { c.checked ? selM.add(m) : selM.delete(m); refresh(); };
      const b = el("b"); b.textContent = m;
      const s = el("span"); s.textContent = `${range[m][0]}\u2013${range[m][1]}`;
      chip.append(c, b, s); grid.append(chip);
    });
    sec.append(grid); root.append(sec);
  });
}

function renderOnly() {
  $("only").innerHTML = "";
  GROUP_ORDER.filter((g) => groups[g]).forEach((g) => {
    const ms = groups[g];
    const active = selM.size === ms.length && ms.every((m) => selM.has(m));
    const b = el("button", "tl" + (active ? " act" : "")); b.textContent = SHORT[g] || g;
    b.onclick = () => { selM = new Set(ms); refresh(); };
    $("only").append(b);
  });
}

function renderControls() {
  const last = years[years.length - 1];
  const p3 = Math.max(years[0], last - 2), p5 = Math.max(years[0], last - 4);
  const active = latestOnly ? "latest" : to === last && from === p3 ? "3" : to === last && from === p5 ? "5" :
    from === years[0] && to === last ? "all" : "";
  $("presets").innerHTML = "";
  [["latest", "Latest year"], ["3", "Last 3 yrs"], ["5", "Last 5 yrs"], ["all", "Full history"]].forEach(([k, t]) => {
    const b = el("button", active === k ? "act" : ""); b.textContent = t;
    b.onclick = () => {
      latestOnly = k === "latest";
      if (k === "all") { from = years[0]; to = last; }
      else if (k !== "latest") { to = last; from = Math.max(years[0], last - (+k - 1)); }
      refresh();
    };
    $("presets").append(b);
  });
  $("from").value = from; $("to").value = to;
  $("from").disabled = $("to").disabled = latestOnly;
  $("sides").innerHTML = "";
  [["both", "Bid + Ask"], ["bid", "Bid"], ["ask", "Ask"]].forEach(([v, t]) => {
    const l = el("label"), r = el("input"); r.type = "radio"; r.name = "side"; r.checked = side === v;
    r.onchange = () => { side = v; refresh(); };
    const s = el("span"); s.textContent = t; l.append(r, s); $("sides").append(l);
  });
}

function refresh() {
  renderMarkets(); renderOnly(); renderControls();
  const list = filtered(), total = list.reduce((s, f) => s + f.size, 0);
  const nm = new Set(list.map((f) => f.market)).size;
  const period = latestOnly ? "latest year each" : from === to ? String(from) : `${from}\u2013${to}`;
  $("mcount").textContent = `${selM.size}/${markets.length}`;
  $("sumA").textContent = `${list.length} files \u00b7 ${fmt(total)}`;
  $("sumB").textContent = `${nm} markets \u00b7 ${period}`;
  $("mSum").innerHTML = busy ? "Downloading..." : `${list.length} files<small>${fmt(total)}</small>`;
  $("sb1").textContent = busy ? "Downloading..." : "Ready";
  $("sb2").textContent = `${list.length} file(s) \u00b7 ${fmt(total)}`;
  $("sb3").textContent = period;
  let note = "";
  if (!selM.size) note = "Kom-pokkhe ekta market select koro.";
  else if (!list.length) note = "Selected market gulo-te ei period-e data nai.";
  else if (total > 1.5e9 && !window.showSaveFilePicker) note = "Boro download: Chrome ba Edge use koro, nahole puro ZIP RAM-e thakbe.";
  $("note").textContent = note; $("note").classList.toggle("show", !!note);
  $("zip").disabled = busy || !list.length || demo;
  $("zip2").disabled = demo || (!busy && !list.length);
  $("zip2").textContent = busy ? "Cancel" : "Download ZIP";
  $("qAll").disabled = busy || demo; $("qSel").disabled = busy || demo || !selM.size;
  $("cancel").style.display = busy ? "" : "none";
  $("rows").innerHTML = list.map((f) =>
    `<tr><td><a href="/dl/${f.name}" data-n="${f.name}">${f.name}</a></td><td>${fmt(f.size)}</td><td>${f.updated.slice(0, 10)}</td></tr>`).join("");
  save();
}

// volume column strip (browser-e)
const strip = (s) => s.replace(/,[^,\r\n]*(?=\r?\n|$)/g, "");
function processStream(body, withVolume, onBytes) {
  const dec = new TextDecoder(), enc = new TextEncoder();
  let buf = "", first = true, doStrip = false;
  return body.pipeThrough(new TransformStream({
    transform(chunk, c) {
      onBytes && onBytes(chunk.length);
      if (withVolume) return c.enqueue(chunk);
      buf += dec.decode(chunk, { stream: true });
      if (first) { const nl = buf.indexOf("\n"); if (nl < 0) return; doStrip = /volume/i.test(buf.slice(0, nl)); first = false; }
      const i = buf.lastIndexOf("\n"); if (i < 0) return;
      const part = buf.slice(0, i + 1); buf = buf.slice(i + 1);
      c.enqueue(enc.encode(doStrip ? strip(part) : part));
    },
    flush(c) { if (!withVolume && buf) c.enqueue(enc.encode(doStrip ? strip(buf) : buf)); },
  }));
}
function saveBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
const say = (t) => { $("status").textContent = t; $("status").classList.add("show"); };

$("rows").addEventListener("click", async (e) => {
  const a = e.target.closest("a[data-n]"); if (!a) return;
  if (demo) { e.preventDefault(); return; }
  if ($("vol").checked) return;
  e.preventDefault(); say("Preparing " + a.dataset.n + "...");
  const r = await fetch("/dl/" + a.dataset.n);
  if (!r.ok) return say("Error " + r.status);
  saveBlob(await new Response(processStream(r.body, false)).blob(), a.dataset.n);
  say("Done.");
});

async function startZip() {
  if (demo) return say("Demo mode: real file nai.");
  const list = filtered(); if (!list.length || busy) return;
  const withVol = $("vol").checked, perFolder = $("folders").checked;
  const total = list.reduce((s, f) => s + f.size, 0);
  let done = 0, n = 0; const t0 = Date.now();
  ctrl = new AbortController(); const signal = ctrl.signal;
  busy = true; refresh();
  $("bar").classList.add("show"); $("pbar").style.width = "0";
  const zipName = "dukascopy-m1-" + new Date().toISOString().slice(0, 10) + ".zip";

  async function* gen() {
    for (const f of list) {
      n++;
      const r = await fetch("/dl/" + f.name, { signal });
      if (!r.ok) throw new Error(f.name + " failed: " + r.status);
      const body = processStream(r.body, withVol, (b) => {
        done += b;
        const pct = Math.min(100, (done / total) * 100), sp = done / 1e6 / Math.max(1, (Date.now() - t0) / 1000);
        $("pbar").style.width = pct + "%";
        say(`${n}/${list.length} \u00b7 ${f.name} \u00b7 ${pct.toFixed(0)}% \u00b7 ${sp.toFixed(1)} MB/s`);
      });
      yield { name: perFolder ? `${f.market}/${f.name}` : f.name, lastModified: new Date(f.updated), input: new Response(body) };
    }
  }
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: zipName, types: [{ description: "ZIP", accept: { "application/zip": [".zip"] } }] });
      await downloadZip(gen()).body.pipeTo(await h.createWritable(), { signal });
    } else saveBlob(await downloadZip(gen()).blob(), zipName);
    $("pbar").style.width = "100%"; say("Done. ZIP saved.");
  } catch (e) {
    say(signal.aborted || e.name === "AbortError" ? "Cancelled." : "Error: " + e.message);
  }
  busy = false; ctrl = null; refresh();
}
const cancelZip = () => ctrl && ctrl.abort();

function demoFiles() {
  const out = [], cy = new Date().getFullYear();
  Object.keys(meta).forEach((m, i) => {
    const start = ["BTCUSD", "ETHUSD", "LTCUSD"].includes(m) ? 2017 : 2003 + ((i * 3) % 10);
    for (let y = start; y <= cy; y++) ["bid", "ask"].forEach((s) =>
      out.push({ name: `${m}_${y}_${s}.csv`, id: 0, market: m, year: y, side: s, size: 18e6 + ((i * 7 + y) % 20) * 1e6, updated: `${y === cy ? cy : y + 1}-01-03T06:00:00Z` }));
  });
  return out;
}

function showEmpty(title, text) {
  $("app").style.display = "none"; $("filesBox").style.display = "none"; $("mbar").style.display = "none"; $("quick").style.display = "none";
  $("emptyBox").innerHTML = `<div class="empty"><b>${title}</b>${text}</div>`;
  $("sb1").textContent = title;
}

async function init() {
  try { meta = await (await fetch("/markets.json")).json(); } catch { meta = {}; }
  if (demo) { files = demoFiles(); $("demoTag").innerHTML = '<span class="demo">demo</span>'; }
  else {
    let r; try { r = await fetch("/api/files"); } catch { r = { ok: false, status: "network" }; }
    if (!r.ok) return showEmpty("Could not load the file list", "Error " + r.status + ". Kichukkhon pore reload koro.");
    files = await r.json();
  }
  if (!files.length) return showEmpty("Data is being prepared", "Backfill cholche. Kichukkhon pore reload dao.");

  markets = [...new Set(files.map((f) => f.market))].sort();
  years = [...new Set(files.map((f) => f.year))].sort((a, b) => a - b);
  markets.forEach((m) => {
    const ys = files.filter((f) => f.market === m).map((f) => f.year);
    range[m] = [Math.min(...ys), Math.max(...ys)]; maxY[m] = range[m][1];
    const g = (meta[m] && meta[m].group) || "Other"; (groups[g] = groups[g] || []).push(m);
  });
  $("from").innerHTML = $("to").innerHTML = years.map((y) => `<option>${y}</option>`).join("");
  selM = new Set(markets); from = to = years[years.length - 1]; latestOnly = true;

  const s = !demo && load();
  if (s) {
    selM = new Set((s.m || []).filter((x) => markets.includes(x)));
    if (years.includes(s.from) && years.includes(s.to) && s.from <= s.to) { from = s.from; to = s.to; }
    if (["both", "bid", "ask"].includes(s.side)) side = s.side;
    latestOnly = s.latestOnly !== false;
    $("vol").checked = s.vol !== false; $("folders").checked = s.folders !== false;
  }

  const last = files.map((f) => f.updated).sort().pop();
  $("stats").textContent = [`${markets.length} markets`, `${years[0]}\u2013${years[years.length - 1]}`,
    fmt(files.reduce((s, f) => s + f.size, 0)), `updated ${last.slice(0, 10)}`].join(" \u00b7 ");
  refresh();
}

$("mAll").onclick = () => { selM = new Set(markets); refresh(); };
$("mNone").onclick = () => { selM = new Set(); refresh(); };
$("mInv").onclick = () => { selM = new Set(markets.filter((m) => !selM.has(m))); refresh(); };
$("from").onchange = (e) => { from = +e.target.value; if (to < from) to = from; latestOnly = false; refresh(); };
$("to").onchange = (e) => { to = +e.target.value; if (from > to) from = to; latestOnly = false; refresh(); };
$("vol").onchange = $("folders").onchange = refresh;
$("zip").onclick = startZip;
$("cancel").onclick = cancelZip;
$("zip2").onclick = () => (busy ? cancelZip() : startZip());
$("qAll").onclick = () => { selM = new Set(markets); latestOnly = true; refresh(); startZip(); };
$("qSel").onclick = () => { if (!selM.size) return; latestOnly = true; refresh(); startZip(); };

const tick = () => { $("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
tick(); setInterval(tick, 30000);

init();
</script>
