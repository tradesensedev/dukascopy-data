name: Dukascopy M1

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Runners at once (1-20)"
        default: "6"
      rounds:
        description: "Auto-continue rounds"
        default: "12"
      prev:
        description: "internal"
        default: "0"
      tail:
        description: "Refresh current year: auto/true/false"
        default: "auto"
      level:
        description: "Speed level 0(fast)..3(slow)"
        default: "2"
      budget:
        description: "Seconds per job"
        default: "7200"
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: dukascopy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      n: ${{ steps.p.outputs.n }}
      rounds: ${{ steps.p.outputs.rounds }}
      tail: ${{ steps.p.outputs.tl }}
      level: ${{ steps.p.outputs.level }}
      budget: ${{ steps.p.outputs.budget }}
      prev: ${{ steps.p.outputs.prev }}
    steps:
      - id: p
        env:
          I_SHARDS: ${{ inputs.shards }}
          I_ROUNDS: ${{ inputs.rounds }}
          I_PREV: ${{ inputs.prev }}
          I_TAIL: ${{ inputs.tail }}
          I_LEVEL: ${{ inputs.level }}
          I_BUDGET: ${{ inputs.budget }}
        run: |
          n=${I_SHARDS:-6}; [ "$n" -lt 1 ] && n=1; [ "$n" -gt 20 ] && n=20
          case "$I_TAIL" in
            true|false) tl=$I_TAIL ;;
            *) tl=true ;;
          esac
          prev=${I_PREV:-0}
          if [ "$prev" = 0 ]; then
            curl -fsSL "https://github.com/${{ github.repository }}/releases/download/meta/index.json" -o i.json 2>/dev/null || echo '{"m":{}}' > i.json
            prev=$(jq '[.m[]|(.b+.a)|map(select(.>0))|length]|add // 0' i.json 2>/dev/null || echo 0)
          fi
          {
            echo "n=$n"
            echo "shards=$(seq 0 $((n-1)) | jq -cs .)"
            echo "rounds=${I_ROUNDS:-12}"
            echo "tl=$tl"
            echo "level=${I_LEVEL:-2}"
            echo "budget=${I_BUDGET:-7200}"
            echo "prev=$prev"
          } >> "$GITHUB_OUTPUT"

  download:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 230
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g dukascopy-node
      - env:
          GH_TOKEN: ${{ github.token }}
          BUDGET: ${{ needs.plan.outputs.budget }}
          MAX_NEW: "8"
          DO_TAIL: ${{ needs.plan.outputs.tail }}
          START_LEVEL: ${{ needs.plan.outputs.level }}
          FASTEST: ${{ needs.plan.outputs.level }}
        run: bash download_market.sh ${{ matrix.shard }} ${{ needs.plan.outputs.n }}

  manifest:
    needs: [plan, download]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: idx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.tag_name|startswith("m1-")) | {t:.tag_name,a:[.assets[]|{n:.name,s:.size,u:.updated_at}]}' > raw.jsonl
          node build_manifest.js raw.jsonl index.json
          gh release view meta >/dev/null 2>&1 || gh release create meta --title "Index" --notes "Site manifest"
          gh release upload meta index.json --clobber
          echo "count=$(jq '[.m[]|(.b+.a)|map(select(.>0))|length]|add // 0' index.json)" >> "$GITHUB_OUTPUT"
      - name: Keepalive (monthly empty commit)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2592000 ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git commit --allow-empty -m "keepalive" && git push
          fi
      - name: Continue next round
        if: ${{ steps.idx.outputs.count != needs.plan.outputs.prev && fromJSON(needs.plan.outputs.rounds) > 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ needs.plan.outputs.rounds }}
          SH: ${{ needs.plan.outputs.n }}
          BUD: ${{ needs.plan.outputs.budget }}
          LV: ${{ needs.plan.outputs.level }}
          PREV: ${{ needs.plan.outputs.prev }}
          TL: ${{ needs.plan.outputs.tail }}
          COUNT: ${{ steps.idx.outputs.count }}
        run: |
          S=$SH; D=$((COUNT-PREV))
          if [ "$TL" != "true" ]; then
            POT=$((S*BUD/50))
            if [ $((D*10)) -lt $((POT*3)) ] && [ "$S" -gt 2 ]; then S=$((S-1))
            elif [ $((D*10)) -gt $((POT*8)) ] && [ "$S" -lt 8 ]; then S=$((S+1)); fi
          fi
          echo "round delta=$D shards $SH -> $S"
          gh workflow run dukascopy.yml --repo "${{ github.repository }}" \
            -f shards="$S" -f rounds="$((R-1))" -f prev="$COUNT" -f tail=false -f level="$LV" -f budget="$BUD"
