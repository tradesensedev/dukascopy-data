name: Dukascopy M1

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel shard jobs (1-20) = ekshathe koyta runner"
        default: "4"
      rounds:
        description: "Auto-continue rounds (1 = single run)"
        default: "1"
      prev:
        description: "internal: previous file count"
        default: "0"
      tail:
        description: "Refresh current year (true/false)"
        default: "true"
      level:
        description: "Speed level 0(fast)..3(slow)"
        default: "2"
      budget:
        description: "Seconds per job before it stops"
        default: "10000"
  schedule:
    - cron: '0 6 * * 6'

permissions:
  contents: write
  actions: write

concurrency:
  group: dukascopy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      n: ${{ steps.p.outputs.n }}
    steps:
      - id: p
        env:
          S: ${{ inputs.shards || '4' }}
        run: |
          n=$S; [ "$n" -lt 1 ] && n=1; [ "$n" -gt 20 ] && n=20
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "shards=$(seq 0 $((n-1)) | jq -cs .)" >> "$GITHUB_OUTPUT"

  download:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 230
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g dukascopy-node
      - env:
          GH_TOKEN: ${{ github.token }}
          BUDGET: ${{ inputs.budget || '10000' }}
          MAX_NEW: "8"
          DO_TAIL: ${{ inputs.tail || 'true' }}
          START_LEVEL: ${{ inputs.level || '2' }}
          FASTEST: ${{ inputs.level || '2' }}
        run: bash download_market.sh ${{ matrix.shard }} ${{ needs.plan.outputs.n }}

  manifest:
    needs: [plan, download]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: idx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.tag_name|startswith("m1-")) | {t:.tag_name,a:[.assets[]|{n:.name,s:.size,u:.updated_at}]}' > raw.jsonl
          node build_manifest.js raw.jsonl index.json
          gh release view meta >/dev/null 2>&1 || gh release create meta --title "Index" --notes "Site manifest"
          gh release upload meta index.json --clobber
          echo "count=$(jq -s '[.[].a|length]|add // 0' raw.jsonl)" >> "$GITHUB_OUTPUT"
      - name: Continue backfill
        if: ${{ steps.idx.outputs.count != (inputs.prev || '0') && fromJSON(inputs.rounds || '1') > 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ inputs.rounds }}
          S: ${{ inputs.shards || '4' }}
          L: ${{ inputs.level || '2' }}
          B: ${{ inputs.budget || '10000' }}
          C: ${{ steps.idx.outputs.count }}
        run: gh workflow run dukascopy.yml --repo "${{ github.repository }}" -f shards="$S" -f rounds="$((R-1))" -f prev="$C" -f tail=false -f level="$L" -f budget="$B"
