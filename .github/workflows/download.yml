name: Download Dukascopy Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 6'   # every Saturday 06:00 UTC

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data --repo ${{ github.repository }} || \
          gh release create data --repo ${{ github.repository }} --title "Dukascopy M1 data" --notes "M1 bid/ask data"

  download:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        market: [XAUUSD, US100, US500, GER40, UK100, JP225, HK50, AUS200, USOIL, DXY, XCUUSD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dukascopy-node
        run: npm install -g dukascopy-node
      - name: Download and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash download_market.sh ${{ matrix.market }}
